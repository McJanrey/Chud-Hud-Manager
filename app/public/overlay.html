<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chud Hud Overlay</title>
<link rel="stylesheet" href="/hud.css">
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden}
  #stage{position:fixed;inset:0}
  #bg{position:fixed;inset:0;width:100%;height:100%;display:none}
  .offline{position:fixed;left:12px;bottom:12px;font:600 14px system-ui;color:#fff;background:#c0392b;padding:6px 10px;border-radius:6px;display:none}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="stage"><div class="hud" id="hud"></div></div>
<div class="offline" id="off">Lost connection to Chud Hud server, retrying…</div>
<script src="/hud.js"></script>
<script>
// /overlay?scene=auto|ingame|bracket|...&event=<id>&bg=pitch (bg only for testing outside OBS). Every event has its own link and all of them are live at once.
const qs = new URLSearchParams(location.search);
const scene = qs.get("scene") || "auto";
const hud = document.getElementById("hud");
let DB = null, GAMES = {}, DRAFT = null;
if (qs.get("bg")) { const c = document.getElementById("bg"); c.style.display = "block"; SaintsHUD.drawBg(c, qs.get("bg") === "pitch" ? "game" : qs.get("bg"), qs.get("game") || ""); }
function fit() { hud.style.transform = `scale(${Math.min(innerWidth / 1280, innerHeight / 720)})`; }
addEventListener("resize", fit); fit();
function draw() {
  if (!DB || LOCKED) return;
  const ev = DB.events.find(e => e.id === (qs.get("event") || DB.onAir)) || DB.events[0];
  if (ev) SaintsHUD.render(hud, ev, GAMES[SaintsHUD.feedKey(ev)] || null, scene, { icons: Object.assign({}, DB.settings && DB.settings.iconsOfficial, DB.settings && DB.settings.icons), kits: DB.settings && DB.settings.kits, draft: DRAFT });
}
function connect() {
  const es = new EventSource("/events?kind=overlay");
  es.addEventListener("db", e => { DB = JSON.parse(e.data).db; draw(); });
  es.addEventListener("draft", e => { DRAFT = JSON.parse(e.data); draw(); }); // League champion select, already delayed by the server
  es.addEventListener("game", e => { const m = JSON.parse(e.data); GAMES[m.key] = m.game; draw(); }); // one feed per kind of source; this event reads its own
  es.onopen = () => document.getElementById("off").style.display = "none";
  es.onerror = () => { document.getElementById("off").style.display = "block"; };
}
connect();
setInterval(draw, 500);
// a copy whose license is switched off (or that was never activated) clears the picture instead of showing stale graphics
let LOCKED = false;
setInterval(async () => {
  try { const s = await (await fetch("/api/license")).json(), lk = !!(s.enforced && !s.licensed);
    if (lk && !LOCKED) { LOCKED = true; hud.innerHTML = ""; const o = document.getElementById("off"); o.textContent = "Chud Hud isn't activated on this PC."; o.style.display = "block"; }
    else if (!lk && LOCKED) location.reload(); } catch (e) { /* offline: leave it */ }
}, 15000); // keeps timers and goal banners ticking between packets
</script>
</body>
</html>
