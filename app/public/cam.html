<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chud Hud camera</title>
<style>
:root{--g:#00693C;--y:#FDC82F;--bg:#08110d;--fg:#eaf3ee;--dim:#8fa59a}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,Segoe UI,sans-serif;display:flex;justify-content:center}
main{width:min(720px,100%);padding:20px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:20px}.bar{height:4px;background:linear-gradient(90deg,var(--g),var(--y));border-radius:2px}
video{width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;object-fit:cover;transform:scaleX(-1)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}select,button{font:inherit;color:var(--fg);background:#10201a;border:1px solid #24402f;border-radius:8px;padding:8px 12px}
button.go{background:var(--g);border-color:var(--g);font-weight:700}button:disabled{opacity:.5}
.pill{padding:4px 10px;border-radius:99px;font-size:13px;background:#10201a;border:1px solid #24402f}.ok{color:#5fe3a1}.warn{color:var(--y)}.bad{color:#ff7a7a}
p{margin:0;color:var(--dim)}
</style></head><body><main>
<div class="bar"></div>
<h1>Chud Hud camera</h1>
<p>Your video goes straight to the broadcast PC on this network. Keep this tab open while you play.</p>
<video id="v" autoplay muted playsinline></video>
<div class="row"><select id="dev" aria-label="Camera"></select><button id="go" class="go" type="button">Go live</button><span id="st" class="pill warn">Not live</span></div>
<p id="msg"></p>
</main>
<script>
const q=new URLSearchParams(location.search),R=q.get("r")||"",T=q.get("t")||"";
const ID=Array.from(crypto.getRandomValues(new Uint8Array(8)),b=>b.toString(16).padStart(2,"0")).join("");
const $=s=>document.querySelector(s),st=(t,c)=>{$("#st").textContent=t;$("#st").className="pill "+c};
let stream=null,es=null,live=false;const pcs=new Map();
const sig=`/api/cam/sig?role=sender&r=${encodeURIComponent(R)}&t=${encodeURIComponent(T)}&id=${ID}`;
const post=(to,msg)=>fetch(sig,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({to,msg})}).catch(()=>{});
if(!R)$("#msg").textContent="This link is missing its camera code. Ask for a new link.";
if(!window.isSecureContext||!navigator.mediaDevices)$("#msg").textContent="This page must be opened with https:// so the browser will allow the camera. Use the link you were given.";

async function devices(){try{const d=(await navigator.mediaDevices.enumerateDevices()).filter(x=>x.kind==="videoinput");const cur=stream&&stream.getVideoTracks()[0]&&stream.getVideoTracks()[0].getSettings().deviceId;
  $("#dev").innerHTML=d.map((x,i)=>`<option value="${x.deviceId}"${x.deviceId===cur?" selected":""}>${(x.label||"Camera "+(i+1)).replace(/</g,"&lt;")}</option>`).join("")}catch{}}
async function open(id){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:Object.assign({width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30}},id?{deviceId:{exact:id}}:{}),audio:false});
  $("#v").srcObject=stream;await devices();
  pcs.forEach(pc=>{const s=pc.getSenders().find(x=>x.track&&x.track.kind==="video");if(s)s.replaceTrack(stream.getVideoTracks()[0])});
}
async function offerTo(viewer){
  if(pcs.has(viewer)){pcs.get(viewer).close();pcs.delete(viewer)}
  const pc=new RTCPeerConnection({iceServers:[]});pcs.set(viewer,pc);
  stream.getTracks().forEach(t=>pc.addTrack(t,stream));
  const s=pc.getSenders()[0];if(s){const p=s.getParameters();p.encodings=[{maxBitrate:3000000}];s.setParameters(p).catch(()=>{})}
  pc.onicecandidate=e=>{if(e.candidate)post(viewer,{type:"ice",candidate:e.candidate})};
  pc.onconnectionstatechange=()=>{if(["failed","closed"].includes(pc.connectionState)){pc.close();pcs.delete(viewer)}};
  await pc.setLocalDescription(await pc.createOffer());
  post(viewer,{type:"offer",sdp:pc.localDescription.sdp});
}
function connect(){
  es=new EventSource(sig);
  es.onopen=()=>{live=true;st("Live","ok")};
  es.onerror=()=>{live=false;st("Reconnecting…","warn")};
  es.addEventListener("msg",async e=>{
    const m=JSON.parse(e.data);
    try{
      if(m.type==="hello")await offerTo(m.from);
      else if(m.type==="answer"){const pc=pcs.get(m.from);if(pc)await pc.setRemoteDescription({type:"answer",sdp:m.sdp})}
      else if(m.type==="ice"){const pc=pcs.get(m.from);if(pc&&m.candidate)await pc.addIceCandidate(m.candidate).catch(()=>{})}
    }catch(err){console.error(err)}
  });
}
$("#go").onclick=async()=>{
  $("#go").disabled=true;
  try{await open();connect();$("#go").textContent="Live";$("#msg").textContent=""}
  catch(err){$("#go").disabled=false;st("No camera","bad");$("#msg").textContent="Could not open the camera: "+(err&&err.message||err)+". Allow camera access in the address bar and try again."}
};
$("#dev").onchange=()=>open($("#dev").value).catch(()=>{});
</script></body></html>
