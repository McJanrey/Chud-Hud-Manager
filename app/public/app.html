/* ---------- server sync ---------- */
async function api(url,body){
  try{const r=await fetch(url,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});
    const j=await r.json().catch(()=>({}));if(!r.ok)toast(j.error||"The server rejected that change.");return j}
  catch(e){toast("Can't reach the Chud Hud server. Restart the app.");return{}}
}
// apply locally, then persist on the server (which tells the other screens)
function put(path,value,eventScoped=true){
  const e=ev();
  if(eventScoped)setL(e,path,value);else setL(DB,path,value);
  return api("/api/set",{event:eventScoped?e.id:null,path,value,by:CLIENT});
}
function connect(){
  const es=new EventSource("/events?kind=dashboard");
  es.addEventListener("db",m=>{const p=JSON.parse(m.data);SCREENS=p.screens||SCREENS;
    const first=!DB;DB=p.db;
    if(first){const q=new URLSearchParams(location.search).get("event");if(q&&DB.events.some(x=>x.id===q)){ui.cur=q;ui.view="overview"}render();return}
    if(p.by===CLIENT){railStatus();return}
    if(p.by==="screens"){railStatus();const s=$("#screens");if(s)s.textContent=screensText();return}
    const a=document.activeElement;
    if(a&&a.closest(".page")&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))mirrors();else render();
  });
  es.addEventListener("game",m=>{const j=JSON.parse(m.data),prev=FEEDS[j.key]&&FEEDS[j.key].source;FEEDS[j.key]=j.game;if(!DB)return;const e=ev();if(!e||SaintsHUD.feedKey(e)!==j.key)return;if(prev&&prev!==j.game.source&&ui.view==="live")render();else{updateStages();liveBits()}});
  es.addEventListener("notice",m=>toast(JSON.parse(m.data).text));
  es.onopen=()=>{online=true;railStatus()};
  es.onerror=()=>{online=false;railStatus()};
}

/* ---------- shell ---------- */
function screensText(){return`${SCREENS.overlay||0} overlay${SCREENS.overlay===1?"":"s"} · ${SCREENS.dashboard||0} dashboard${SCREENS.dashboard===1?"":"s"} connected`}
function sourceState(){
  if(!online)return["bad","Server offline"];
  if(!G())return["warn","Waiting…"];
  if(G().source==="manual")return["ok",((ev()||{}).game||"Scored")+" · scored by hand"];
  if(G().source==="mc"){const s=G().mc;return s&&s.connected?["ok","Minecraft · server connected"]:G().connected?["ok","Minecraft · screen OCR"]:["warn","Minecraft · no server or screen reading"]}
  const src={rl:"Rocket League",lol:"League of Legends",ocr:"Screen OCR",demo:"Demo (test)",push:"External feed"}[G().source]||G().source||"No source";
  const eg=(ev()||{}).game,fg={rl:"Rocket League",lol:"League of Legends"}[G().source];
  if(fg&&eg&&fg!==eg)return["bad","Feed is "+fg+" but the event is "+eg];
  if(G().source==="ocr"){const o=G().ocr||{};return o.running?(G().connected?["ok","Screen OCR · reading"]:["warn","Screen OCR · "+(o.error?"capture problem":"starting")]):["warn","Screen OCR · not started"]}
  if(G().source==="lol")return G().inMatch?["ok","League · in game"]:G().connected?["warn","League · loading"]:["bad","League · no game or replay"];
  if(G().source==="rl")return G().connected?(G().inMatch?["ok","Rocket League · in match"]:["warn","Rocket League · no match"]):["bad","Rocket League · not found"];
  return G().connected?["ok",src]:["warn",src+" · no data"];
}

function railStatus(){const sb=$("#srvbanner");if(sb)sb.hidden=online;const el=$("#conn");if(!el)return;const[c,t]=sourceState();el.innerHTML=`<span class="pill ${c==="bad"?"err":c}"><span class="lbl">${esc(t)}</span></span><span class="faint" style="font-size:12px;padding-left:2px">${screensText()}</span>`}

  const grp=(t,vs)=>`<div class="navgroup">${t}</div>${vs.map(link).join("")}`;
  const nav=e?grp("Event setup",["overview","teams","tournament","talent"])
    +grp("Live game",["live",...(GAMEPAGE[e.game]?[GAMEPAGE[e.game]]:[]),"ocr"])
    +grp("Broadcast",["hud","camera","graphics","schedule","bracket","standings","outputs"])
    :`<div class="navgroup">Workspace</div><a class="nl on" href="#" data-act="home" aria-current="page" title="My Events">${ico("events")}<span class="t">My Events</span></a>`;
  const crest=(DB&&DB.settings&&DB.settings.brand&&DB.settings.brand.logo)||"/brand/chud-hud.png";
  return`<aside class="nav${PREF.min?" collapsed":""}"><div class="brand"><div class="crest has"><img src="${esc(crest)}" alt="Chud Hud logo"></div><div><b>Chud Hud</b><small>Control room</small></div></div>
    <button class="evsw" type="button" data-act="palette" title="Switch event (Ctrl+K)"><div class="cover" style="${e?`background-image:${coverCss(e)}`:"background:var(--surface-3)"}"></div><span><b>${e?esc(e.name):"No event open"}</b><small>${e?esc(e.game):"Choose one to begin"}</small></span>${ico("updown")}</button>

live(e){

ocr(e){

  return`<div class="halves" style="grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)"><div class="sec">
    <div class="sechead"><div><h2>Screen OCR</h2><p class="sub">For games without a live data feed. Pick the screen or window showing the game, then drag boxes over the score, clock and team names.</p></div><span class="pill" id="ocrPill">…</span></div>
    <div class="row c"><b style="font:700 13px var(--f-head)">1. Pick what to read</b><button class="btn sm" type="button" data-act="ocrSources">Refresh list</button></div>
    <div class="srcgrid" id="ocrSources"><span class="note">Loading…</span></div>
    <div class="note">Capture needs the game in <b>borderless windowed</b> mode. Exclusive fullscreen can't be captured.</div>
    <b style="font:700 13px var(--f-head)">2. Draw a box around each value</b>
    <div class="ocr-stage" id="ocrStage"><div class="empty" id="ocrEmpty">Pick a screen or window above to see it here.</div><img id="ocrFrame" alt="" hidden><div id="ocrBoxes"></div></div>
    <div class="row c"><label class="fld" style="max-width:220px;flex:none"><span>New box reads</span><select id="ocrNewRole">${Object.entries(OCR_ROLES).map(([k,[n]])=>`<option value="${k}">${n}</option>`).join("")}</select></label>
      <span class="note" style="align-self:flex-end;flex:1">Drag on the picture to draw. Drag a box to move it, or its corner to resize.</span></div>
  </div><div class="sec">
    <div class="sechead"><h2>3. Check and start</h2></div>
    <div class="row c"><button class="btn ${on?"danger":"blue"}" type="button" data-act="${on?"ocrStop":"ocrStart"}">${on?"Stop reading":"Start reading"}</button>
      <label class="fld" style="max-width:140px;flex:none"><span>Read every (ms)</span><input type="number" id="ocrInterval" min="250" max="5000" step="50" value="${c.interval||800}"></label>
      <label class="fld" style="max-width:200px;flex:none"><span>Starting layout</span><select id="ocrLayout"><option value="">Choose…</option><option value="top">Top-centre scorebar</option><option value="corners">Scores in the top corners</option><option value="fn">Fortnite: match results screen</option><option value="dbd">Dead by Daylight: trial tally screen</option></select></label></div>
    <p class="note" id="ocrError"></p>

/* what this game reads from, and how to set it up */
function gameData(e){
  const box=(t,b)=>`<div class="box"><b>${t}</b><p class="sub">${b}</p></div>`,g=e.game;
  const other=box("Other trackers",`Any program can send Stats API–shaped JSON to <code class="mono">${esc(location.origin)}/api/ingest</code>, for example <code>{"Event":"UpdateState","Data":{…}}</code>, with this event's source set to External on Live Game.`);
  if(g==="Rocket League")return box("Rocket League (official Stats API)",`On the game PC, edit <code>&lt;Install Dir&gt;/TAGame/Config/TAStatsAPI.ini</code> (or <code>DefaultStatsAPI.ini</code>), set <code>PacketSendRate=30</code> under <code>[TAGame.MatchStatsExporter_TA]</code>, then restart the game. Spectate the match so boost and the player card are sent.`)+other;
  if(g==="League of Legends")return box("League of Legends (Live Client Data API)","Nothing to configure. Run Chud Hud on the PC that is playing, spectating or watching a replay, and data flows once the match loads: kills, deaths, assists, CS, levels, respawn timers, towers, dragons and barons. Replay controls need the Replay API switched on: Live Game has a button for it.")+other;
  if(g==="Minecraft")return box("Minecraft (Java server)","Connect your server on the Minecraft page: RCON for who is online, health and the border, and the server log for kills and deaths. With no server, Screen OCR can read the alive count, kills, clock and border from the screen.")+other;
  if(g==="Riftbound")return box("Riftbound","There is no live data feed. You score the match by hand on the Riftbound page: points, games, turns, the clock and the cards in play.");
  if(g==="Dead by Daylight")return box("Dead by Daylight","The game has no live data feed, no spectator mode and no official API. Score each trial on the Trials page: kills, escapes and generators. Screen OCR can read the end-of-trial screen if you point it at the game window.");
  if(g==="Fortnite")return box("Fortnite","Epic gives casters no live match feed. Score each match on the Fortnite scoring page: placement and eliminations per team, with the placement tiers set to your event's rules.");
  if(g==="Valorant")return box("VALORANT 2v2 Skirmish","Riot gives spectators no live data. Score each round on the Skirmish page (first to 10 by default), or let Screen OCR read the observer's screen for names, scores and the clock.")+other;
  return box(esc(g)+" (screen reading)","${esc(g)} has no live data feed, so scores, the clock and team names are read from the screen with Screen OCR. Pick the game's window on the Screen OCR page and draw a box around each value.".replace("${esc(g)}",esc(g)))+other;
}

    <div class="sec"><div><h2>Roster</h2><p class="sub">Player names exactly as they appear in Minecraft. They label the HUD and match kills from the server log. Remove players on Players &amp; Teams.</p></div>
      <div class="row nowrap"><label class="fld"><span>Add players (separated by spaces, commas or new lines)</span><textarea id="mcNames" rows="2" style="background:var(--field);border:1px solid var(--line);border-radius:9px;padding:8px 11px;width:100%;font:inherit;color:inherit"></textarea></label><button class="btn" type="button" data-act="mcAddNames">Add</button></div>

    <div class="sec"><div><h2>Server connection</h2><p class="sub">Reads a Java server you run, with no plugin or mod. In <code>server.properties</code> set <code>enable-rcon=true</code>, <code>rcon.port</code> and <code>rcon.password</code>, then give the path of <code>logs\\latest.log</code> so deaths and kills are counted. It connects as soon as an event for Minecraft exists.</p></div>

rb(e){

      <div class="row"><div class="fld" style="flex:none"><span>Match clock</span>${clockBtns("rb.clock")}</div><label class="fld" style="max-width:190px"><span>Time limit (minutes, 0 counts up)</span><input type="number" min="0" max="240" id="rbLimit" value="${r.limitMinutes||0}"></label></div>
      <div class="row c">${[0,1].map(s=>`<button class="btn" type="button" data-act="rbAward" data-arg="${s}">${esc(nm(s))} wins the game</button>`).join("")}<button class="btn danger" type="button" data-act="rbResetGame">Reset the board</button></div>

    <div class="sec"><div class="sechead"><h2>Spotlight</h2>${F.sw("rb.spotlight.show","Show on screen")}</div>${F.sel("rb.spotlight.cardId","Card",[["","None"],...cards.map(c=>[c.id,c.name])])}</div>

/* ---------- VALORANT 2v2 Skirmish, Dead by Daylight and Fortnite: scored by hand ---------- */
const GAMEPAGE={"Minecraft":"mc","Riftbound":"rb","Fortnite":"fn","Dead by Daylight":"dbd","Valorant":"val"};
const gameOcr=()=>(FEEDS.ocr&&FEEDS.ocr.gameOcr&&Date.now()-FEEDS.ocr.gameOcr.t<120000)?FEEDS.ocr.gameOcr:null;
function dbdRead(v){const o=[1,2,3,4].map(i=>String(v["dbdS"+i]||"")),esc4=o.filter(t=>/escap|hatch/i.test(t)).length,kills=o.filter(t=>/sacrific|kill|dead|died|hook/i.test(t)).length;return{escapes:esc4,kills,gens:Math.max(0,Math.min(5,+v.dbdGens||0))}}
function gameOcrHtml(e){
  const v=gameOcr(),go=`<button class="btn sm" type="button" data-act="nav" data-arg="ocr">Open Screen OCR</button>`;
  if(e.game==="Dead by Daylight"){
    if(!v)return`<p class="note">Point Screen OCR at the game window on the trial tally screen (pick the "Dead by Daylight: trial tally screen" layout and line the boxes up) and its reading shows here. Nothing is added to the score until you press a button.</p><div class="row c">${go}</div>`;
    const r=dbdRead(v);
    return`<p class="note">Read from the screen: <b>${r.kills}</b> kill${r.kills===1?"":"s"}, <b>${r.escapes}</b> escape${r.escapes===1?"":"s"}, <b>${r.gens}</b> generator${r.gens===1?"":"s"}. Check it against the screen, then add it as a trial.</p>
      <div class="row c"><button class="btn primary" type="button" data-act="dbdFromOcr" data-arg="0">Add trial: ${esc(sideName(e,0))} was the killer</button><button class="btn primary" type="button" data-act="dbdFromOcr" data-arg="1">Add trial: ${esc(sideName(e,1))} was the killer</button>${go}</div>`;
  }
  if(!v||v.fnPlace==null&&v.fnElims==null)return`<p class="note">Point Screen OCR at the game window on the match results screen (pick the "Fortnite: match results screen" layout and line the boxes up) and its reading shows here. Nothing is added to the table until you press the button.</p><div class="row c">${go}</div>`;
  const ms=e.fn.matches;
  return`<p class="note">Read from the screen: placement <b>${v.fnPlace==null?"–":v.fnPlace}</b>, eliminations <b>${v.fnElims==null?"–":v.fnElims}</b>. Pick the team and the match, check it against the screen, then apply it.</p>
    <div class="row c"><label class="fld" style="max-width:220px"><span>Team</span><select id="fnOcrTeam">${e.teams.map((t,i)=>`<option value="${i}">${esc(t.name)}</option>`).join("")}</select></label>
    <label class="fld" style="max-width:180px"><span>Match</span><select id="fnOcrMatch">${ms.map((m,j)=>`<option value="${j}"${j===ms.length-1?" selected":""}>Match ${j+1}</option>`).join("")}<option value="new"${ms.length?"":" selected"}>New match</option></select></label>
    <button class="btn primary" type="button" data-act="fnFromOcr">Apply</button>${go}</div>`;
}
const sideTeam=(e,s)=>e.teams.find(x=>x.id===(s?e.live.right:e.live.left));
const sideName=(e,s)=>{const t=sideTeam(e,s);return t?t.name:(s?"Right team":"Left team")};
Object.assign(VIEWS,{
val(e){
  const v=e.val,t=+v.target||10,sc=e.live.score,done=sc[0]>=t||sc[1]>=t;
  return`<div class="halves"><div class="sec" style="gap:24px">
    <div class="sec"><div class="sechead"><div><h2>2v2 Skirmish</h2><p class="sub">First team to ${t} rounds wins. Add each round as it ends and everything on stream follows. There is no live data feed for this mode: score it here, or let Screen OCR read the observer's screen.</p></div>${done?`<span class="pill ok">${esc(sideName(e,sc[0]>=t?0:1))} win</span>`:""}</div>
      <div class="cols">${[0,1].map(s=>`<div class="box"><b>${esc(sideName(e,s))}</b><div class="row c" style="justify-content:space-between"><span class="mono" style="font-size:44px" data-mirror="live.score.${s}">${sc[s]}</span><button class="btn primary" type="button" data-act="valRound" data-arg="${s}">+ Round</button></div></div>`).join("")}</div>
      <div class="row c"><button class="btn" type="button" data-act="valUndo">Undo last round</button><button class="btn danger" type="button" data-act="valReset">New match</button></div>
      <div class="cols" style="--n:4">${F.num("val.target","Rounds to win",'min="1" max="30" data-rerender')}${F.text("live.gameSeries","Label on stream","2V2 SKIRMISH")}${F.sel("live.left","Left team",teamOpts(e))}${F.sel("live.right","Right team",teamOpts(e))}</div>
      <p class="note">Each team has two players. Add them on Players &amp; Teams.</p></div>
  </div><div class="sec">${stage("ingame")}</div></div>`;
},
dbd(e){
  const d=e.dbd,sc=SaintsHUD.dbdScore(e);
  return`<div class="halves"><div class="sec" style="gap:24px">
    <div class="sec"><div class="sechead"><div><h2>Dead by Daylight</h2><p class="sub">One trial is one killer against survivors. Add a trial when it starts and fill in the result. The killer's team scores per kill, the survivors' team per escape and per generator. The game has no live data feed, so you score it here.</p></div></div>
      <div class="cols">${[0,1].map(s=>`<div class="box"><b>${esc(sideName(e,s))}</b><div class="mono" style="font-size:44px">${sc.total[s]}</div></div>`).join("")}</div>
      <div class="cols" style="--n:2">${F.sel("live.left","Left team",teamOpts(e))}${F.sel("live.right","Right team",teamOpts(e))}</div>
      <div class="cols" style="--n:3">${F.num("dbd.killPts","Points per kill",'min="0" data-rerender')}${F.num("dbd.escapePts","Points per escape",'min="0" data-rerender')}${F.num("dbd.genPts","Points per generator",'min="0" step="0.5" data-rerender')}</div>
      <p class="note">Each team has five players: a killer and four survivors in turn. Add them on Players &amp; Teams.</p></div>
    <div class="sec"><div class="sechead"><h2>Read the trial screen</h2></div><div id="gameOcrBox">${gameOcrHtml(e)}</div></div>
  </div><div class="sec">${stage("ingame")}</div></div>
  <div class="sec"><div class="sechead"><h2>Trials</h2><button class="btn" type="button" data-act="dbdAdd">+ Add trial</button></div>
      <div class="tw"><table class="grid"><thead><tr><th style="width:44px">#</th><th>Killer</th><th>Kills</th><th>Escapes</th><th>Generators</th><th>${esc(sideName(e,0))}</th><th>${esc(sideName(e,1))}</th><th style="width:44px"></th></tr></thead><tbody>
      ${d.trials.map((t,i)=>`<tr><td>${i+1}</td><td>${F.sel(`dbd.trials.${i}.killer`,"",[[0,sideName(e,0)],[1,sideName(e,1)]],"data-num data-rerender")}</td><td>${F.num(`dbd.trials.${i}.kills`,"",'min="0" max="4" data-rerender')}</td><td>${F.num(`dbd.trials.${i}.escapes`,"",'min="0" max="4" data-rerender')}</td><td>${F.num(`dbd.trials.${i}.gens`,"",'min="0" max="5" data-rerender')}</td><td class="mono">${sc.trials[i].pts[0]}</td><td class="mono">${sc.trials[i].pts[1]}</td><td><button class="btn icon" type="button" data-act="dbdDel" data-arg="${i}" aria-label="Delete trial ${i+1}">${ico("trash")}</button></td></tr>`).join("")||`<tr><td colspan="8" class="note">No trials yet. Add the first one.</td></tr>`}
      </tbody></table></div></div>`;
},
fn(e){
  const f=e.fn,rows=SaintsHUD.fnTable(e);
  return`<div class="halves"><div class="sec" style="gap:24px">
    <div class="sec"><div class="sechead"><div><h2>Fortnite scoring</h2><p class="sub">Enter each team's placement and eliminations for every match below. Points are the placement tier a team lands in plus points per elimination. There is no live data feed for a caster, so you score it here.</p></div></div>
      <div class="cols" style="--n:3">${F.num("fn.elimPts","Points per elimination",'min="0" step="0.5" data-rerender')}</div>
      <div><b style="font-size:13px">Placement tiers</b>
        <div class="tw" style="margin-top:8px"><table class="grid"><thead><tr><th>Placed up to</th><th>Points</th><th style="width:44px"></th></tr></thead><tbody>
        ${f.placePts.map((t,i)=>`<tr><td>${F.num(`fn.placePts.${i}.to`,"",'min="1" max="100" data-rerender')}</td><td>${F.num(`fn.placePts.${i}.pts`,"",'min="0" data-rerender')}</td><td><button class="btn icon" type="button" data-act="fnTierDel" data-arg="${i}" aria-label="Remove tier">${ico("trash")}</button></td></tr>`).join("")}
        </tbody></table></div><button class="btn sm" type="button" data-act="fnTierAdd" style="margin-top:8px">+ Add tier</button></div></div>
    <div class="sec"><div class="sechead"><h2>Read the results screen</h2></div><div id="gameOcrBox">${gameOcrHtml(e)}</div></div>
  </div><div class="sec" style="gap:24px">
    <div class="sec"><div class="sechead"><h2>Leaderboard</h2><span class="note">${f.matches.length} match${f.matches.length===1?"":"es"}</span></div>
      <div class="tw"><table class="grid"><thead><tr><th style="width:44px">#</th><th>Team</th><th>Points</th><th>Wins</th><th>Elims</th><th>Played</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td>${r.rank}</td><td>${esc(r.team.name)}</td><td><b>${r.pts}</b></td><td>${r.wins}</td><td>${r.elims}</td><td>${r.played}</td></tr>`).join("")||`<tr><td colspan="6" class="note">No teams yet. Add them on Players &amp; Teams.</td></tr>`}
      </tbody></table></div></div>
    ${stage("ingame")}
  </div></div>
  <div class="sec">
    <div class="sechead"><div><h2>Matches</h2><p class="sub">Placement is 1 for the winner. Leave a team at 0 if it did not play.</p></div><span class="row c"><button class="btn" type="button" data-act="fnAdd">+ Add match</button><button class="btn" type="button" data-act="fnDel"${f.matches.length?"":" disabled"}>Remove last</button></span></div>
    <div class="tw"><table class="grid"><thead><tr><th>Team</th>${f.matches.map((m,j)=>`<th colspan="2" style="text-align:center">Match ${j+1}</th>`).join("")}</tr>
      <tr><th></th>${f.matches.map(()=>`<th>Place</th><th>Elims</th>`).join("")}</tr></thead><tbody>
      ${e.teams.map((t,i)=>`<tr><td>${esc(t.name)}</td>${f.matches.map((m,j)=>`<td>${F.num(`fn.matches.${j}.place.${i}`,"",'min="0" max="100" data-rerender')}</td><td>${F.num(`fn.matches.${j}.elims.${i}`,"",'min="0" max="60" data-rerender')}</td>`).join("")}</tr>`).join("")}
      </tbody></table></div>
  </div>`;
},
});
/* League settings: gold, which timers and counters show, and the objective timings */
const TIMING_LABELS={dragonFirst:"Dragon first spawn (s)",dragonRespawn:"Dragon respawn (s)",elderRespawn:"Elder respawn (s)",grubsFirst:"Grubs first spawn (s)",grubsWaves:"Grub camps per game",grubsRespawn:"Grubs respawn (s)",grubsDespawn:"Grubs despawn (s)",heraldFirst:"Herald first spawn (s)",heraldDespawn:"Herald despawn (s)",baronFirst:"Baron first spawn (s)",baronRespawn:"Baron respawn (s)",baronBuff:"Baron buff length (s)",elderBuff:"Elder buff length (s)"};

    <div class="cols" style="--n:3">${F.sel("lol.goldMode","Gold",[["estimate","Estimated (recommended)"],["items","Value of items held"],["manual","Typed in"]])}${F.num("lol.goldScale","Estimate scale (1 = as modelled)",'step="0.01"')}${F.num("lol.passiveStart","Passive gold starts (s)")}</div>

    <div><b style="font:700 13px var(--f-head)">Timers shown (top-left)</b><div class="chks" style="margin-top:8px">${[["dragon","Dragon"],["grubs","Void grubs"],["herald","Rift Herald"],["elder","Elder"],["baron","Baron"]].map(([k,l])=>F.chk(`lol.showTimers.${k}`,l)).join("")}</div></div>
    <div><b style="font:700 13px var(--f-head)">Claimed objectives shown (under the bar)</b><div class="chks" style="margin-top:8px">${[["dragons","Dragons"],["heralds","Heralds"],["grubs","Void grubs"]].map(([k,l])=>F.chk(`lol.counters.${k}`,l)).join("")}</div></div>
    <details><summary class="note" style="cursor:pointer">Objective timings (Riot moves these between seasons)</summary><div class="cols" style="--n:3;margin-top:10px">${Object.keys(TIMING_LABELS).map(k=>F.num(`lol.timers.${k}`,TIMING_LABELS[k])).join("")}</div></details>

function ocrSave(now){clearTimeout(ocrSaveT);const go=()=>api("/api/ocr/config",ocrCfg());return now?go():(ocrSaveT=setTimeout(go,300))}
async function ocrMount(){
  const st=await fetch("/api/ocr/state").then(r=>r.json()).catch(()=>({available:false}));
  if(!st.available){if(OCR.available){OCR.available=false;render()}return}

function ocrLoadSources(){
  fetch("/api/ocr/sources").then(r=>r.json()).then(l=>{OCR.shown=(Array.isArray(l)?l:[]).filter(s=>!/Chud Hud/i.test(s.name));ocrSourcesRender()})
    .catch(()=>{const el=$("#ocrSources");if(el)el.innerHTML=`<span class="note">Couldn't list screens and windows.</span>`});

  const el=$("#ocrSources");if(!el)return;const c=ocrCfg();
  el.innerHTML=OCR.shown.map((s,i)=>`<button type="button" class="src" data-act="ocrPick" data-arg="${i}" aria-pressed="${c.sourceId===s.id||(!!c.sourceName&&c.sourceName===s.name)}"><img src="${s.thumb}" alt=""><span>${esc(s.name)}</span></button>`).join("")||`<span class="note">No screens or windows found.</span>`;

function ocrFrameLoop(){
  clearInterval(ocrTimer);
  ocrTimer=setInterval(()=>{
    const img=$("#ocrFrame"),c=ocrCfg();
    if(ui.view!=="ocr"||document.hidden||!img||ocrBusy||(!c.sourceId&&!c.sourceName))return;
    ocrBusy=true;const n=new Image();
    n.onload=()=>{img.src=n.src;img.hidden=false;const em=$("#ocrEmpty");if(em)em.hidden=true;const st=$("#ocrStage");if(st)st.style.aspectRatio=`${n.naturalWidth}/${n.naturalHeight}`;ocrBusy=false};
    n.onerror=()=>{const em=$("#ocrEmpty");if(em){em.hidden=false;em.textContent="Can't capture that source. Pick it again from the list."}ocrBusy=false};
    n.src=`/api/ocr/frame?source=${encodeURIComponent(c.sourceId||"")}&t=${Date.now()}`;
  },1200);
}

    <td><div class="row c nowrap"><button class="btn sm" type="button" data-act="ocrTest" data-arg="${r.id}">Test</button>
    <select data-rpol="${r.id}" aria-label="Text colour">${[["auto","Auto"],["light","Light text"],["dark","Dark text"]].map(([v,n])=>`<option value="${v}"${(r.polarity||"auto")===v?" selected":""}>${n}</option>`).join("")}</select>
    <button class="btn icon" type="button" data-act="ocrDel" data-arg="${r.id}" aria-label="Delete box">${ico("x")}</button></div></td></tr>`).join("")||`<tr><td colspan="4" class="sub" style="padding:14px">No boxes yet. Drag on the picture to draw one.</td></tr>`;

function ocrLive(){
  const o=G()&&G().ocr||{},pill=$("#ocrPill");
  if(pill){pill.className="pill "+(o.running&&!o.error?"ok":o.error?"bad":"");pill.textContent=o.running?(o.error?"Problem":`Reading · ${o.cycleMs||0} ms per pass`):"Stopped"}
  const er=$("#ocrError");if(er)er.textContent=o.error||"";
  $$("[data-rawof]").forEach(td=>{const r=(o.readings||{})[td.dataset.rawof];td.textContent=r?(r.error?"error":(r.raw||"(blank)")):"—"});
  $$("[data-valof]").forEach(td=>{const r=(o.readings||{})[td.dataset.valof];td.textContent=r&&r.value!=null?(r.key==="clock"?SaintsHUD.fmt(r.value):r.value):"—";td.className="read "+(r&&r.ok?"ok":"bad")});
}

  if(k.key==="Escape"){closeOverlay();return}
  if(OVL.type==="palette"){
    if(k.key==="ArrowDown"||k.key==="ArrowUp"){k.preventDefault();const n=Math.max(1,PAL.length);OVL.i=(OVL.i+(k.key==="ArrowDown"?1:-1)+n)%n;$("#palList").innerHTML=palList();const on=$("#palList .on");on&&on.scrollIntoView({block:"nearest"});return}
    if(k.key==="Enter"){k.preventDefault();const it=PAL[OVL.i];if(it){closeOverlay();it.run()}}
  }else if(OVL.type==="new"&&k.key==="Enter"&&k.target.id==="neName"){k.preventDefault();createEvent()}
});
/* click an element in the Hunger Games preview to edit it */
document.addEventListener("click",ev0=>{
  const el=ev0.target.closest("[data-stage] [data-el]"),e=ev();if(!el||!e||ui.view!=="hud"||e.game!=="Minecraft")return;
  HGEL=el.dataset.el;render();
});
/* drag a caster nameplate anywhere on the preview */
document.addEventListener("pointerdown",ev0=>{
  const np=ev0.target.closest(".np"),st=np&&np.closest("[data-stage]"),e=ev();if(!np||!st||!e)return;
  const i=+np.dataset.i,k=st.clientWidth/1280,x0=parseFloat(np.style.left),y0=parseFloat(np.style.top),sx=ev0.clientX,sy=ev0.clientY;
  DRAG=true;np.setPointerCapture(ev0.pointerId);ev0.preventDefault();
  const move=m=>{const x=Math.max(0,Math.min(1280-np.offsetWidth,Math.round(x0+(m.clientX-sx)/k))),y=Math.max(0,Math.min(720-np.offsetHeight,Math.round(y0+(m.clientY-sy)/k)));np.style.left=x+"px";np.style.top=y+"px";np.dataset.x=x;np.dataset.y=y};
  const up=()=>{np.removeEventListener("pointermove",move);np.removeEventListener("pointerup",up);DRAG=false;if(np.dataset.x!=null){put(`camera.seats.${i}.x`,+np.dataset.x);put(`camera.seats.${i}.y`,+np.dataset.y)}};
  np.addEventListener("pointermove",move);np.addEventListener("pointerup",up);
});
document.addEventListener("pointerdown",ev0=>{
  const box=ev0.target.closest("#ocrBoxes");if(!box)return;
  const rect=box.getBoundingClientRect(),c=ocrCfg(),cl=v=>Math.max(0,Math.min(1,v)),rel=(x,y)=>[(x-rect.left)/rect.width,(y-rect.top)/rect.height];
  const rg=ev0.target.closest(".rg"),start=rel(ev0.clientX,ev0.clientY);let mode,reg,orig;
  if(rg){reg=c.regions.find(r=>r.id===rg.dataset.rid);mode=ev0.target.classList.contains("hd")?"resize":"move";OCR.sel=reg.id}
  else{const key=$("#ocrNewRole").value;reg={id:uid(),key,label:"",type:OCR_ROLES[key][1],polarity:"auto",x:cl(start[0]),y:cl(start[1]),w:0,h:0};c.regions.push(reg);OCR.sel=reg.id;mode="draw"}
  orig=Object.assign({},reg);box.setPointerCapture(ev0.pointerId);ev0.preventDefault();
  const move=m=>{const[x,y]=rel(m.clientX,m.clientY),dx=x-start[0],dy=y-start[1];
    if(mode==="move"){reg.x=cl(Math.min(orig.x+dx,1-reg.w));reg.y=cl(Math.min(orig.y+dy,1-reg.h))}
    else if(mode==="resize"){reg.w=Math.max(.01,Math.min(orig.w+dx,1-reg.x));reg.h=Math.max(.01,Math.min(orig.h+dy,1-reg.y))}
    else{reg.x=cl(Math.min(x,start[0]));reg.y=cl(Math.min(y,start[1]));reg.w=Math.abs(cl(x)-cl(start[0]));reg.h=Math.abs(cl(y)-cl(start[1]))}
    ocrBoxes()};
  const up=()=>{box.removeEventListener("pointermove",move);box.removeEventListener("pointerup",up);
    if(mode==="draw"&&(reg.w<.01||reg.h<.01)){c.regions=c.regions.filter(r=>r!==reg);OCR.sel=null}
    ocrBoxes();ocrRows();ocrSave()};
  box.addEventListener("pointermove",move);box.addEventListener("pointerup",up);
});

/* ---------- League replay controls ---------- */
let RP=null,rpBusy=false;
const lolPost=async(what,body)=>{const j=await api("/api/lol/"+what,body);rpPoll();return j};
async function rpPoll(){
  if(ui.view!=="live"||rpBusy||!$("#replayPanel"))return;
  rpBusy=true;try{RP=await fetch("/api/lol/replay").then(r=>r.json())}catch(e){RP=null}rpBusy=false;rpRender();
}
function rpRender(){
  const el=$("#replayPanel");if(!el||!RP)return;
  if(el.contains(document.activeElement)&&/range|select/.test(document.activeElement.type||""))return; // don't fight the user's hand
  if(!RP.available){const c=RP.config||{};
    el.innerHTML=`<div class="rp"><b>Replay controls</b><p class="note">${esc(RP.reason||"")}</p>${c.found?(c.enabled?`<p class="note">The Replay API is switched on in game.cfg. Close the replay and open it again for it to take effect.</p>`:`<div class="row c"><button class="btn sm blue" type="button" data-act="enableReplayApi">Turn on Replay API</button><span class="note">Adds EnableReplayApi=1 to ${esc(c.file)}. Reopen the replay afterwards.</span></div>`):`<p class="note">League's game.cfg wasn't found in C:\\Riot Games\\League of Legends. Set the LOL_DIR variable to your install folder.</p>`}</div>`;return}
  const pb=RP.playback||{},rn=RP.render||{},fm=s=>SaintsHUD.fmt(Math.floor(s||0));
  const names=(G()&&G().players||[]).map(p=>p.name);
  const modes=["fps","tps","top"].concat(rn.cameraMode&&!["fps","tps","top"].includes(rn.cameraMode)?[rn.cameraMode]:[]);
  const bools=Object.keys(rn).filter(k=>typeof rn[k]==="boolean"&&/^interface/.test(k));
  el.innerHTML=`<div class="rp"><div class="row c" style="justify-content:space-between"><b>Replay controls</b><span class="read">${fm(pb.time)} / ${fm(pb.length)}</span></div>
    <input type="range" id="rpTime" min="0" max="${Math.floor(pb.length||0)}" step="1" value="${Math.floor(pb.time||0)}" aria-label="Replay time">
    <div class="row c"><button class="btn sm blue" type="button" data-act="rpPause">${pb.paused?"Play":"Pause"}</button>${[-30,-10,10,30].map(d=>`<button class="btn sm" type="button" data-act="rpSeek" data-arg="${d}">${d>0?"+":""}${d}s</button>`).join("")}</div>
    <div class="row c"><span class="note">Speed</span>${[0.5,1,2,4,8].map(s=>`<button class="btn sm${pb.speed===s?" blue":""}" type="button" data-act="rpSpeed" data-arg="${s}">${s}×</button>`).join("")}</div>
    <div class="row">${"cameraMode" in rn?`<label class="fld" style="max-width:150px"><span>Camera</span><select data-rp="cameraMode">${modes.map(v=>`<option${rn.cameraMode===v?" selected":""}>${v}</option>`).join("")}</select></label>`:""}
    ${"selectionName" in rn&&names.length?`<label class="fld"><span>Follow player</span><select data-rp="selectionName"><option value="">None</option>${names.map(n=>`<option${rn.selectionName===n?" selected":""}>${esc(n)}</option>`).join("")}</select></label>`:""}</div>
    ${bools.length?`<div class="chks">${bools.map(k=>`<label class="chk"><input type="checkbox" data-rp="${k}"${rn[k]?" checked":""}>${esc(k.replace(/^interface/,"").replace(/([A-Z])/g," $1").trim())}</label>`).join("")}</div>`:""}</div>`;
}
setInterval(rpPoll,1500);

render();connect();
})();
</script>
