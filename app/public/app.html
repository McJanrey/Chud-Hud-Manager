/* ---------- server sync ---------- */
async function api(url,body){
  try{const r=await fetch(url,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});
    const j=await r.json().catch(()=>({}));if(!r.ok)toast(j.error||"The server rejected that change.");return j}
  catch(e){toast("Can't reach the Chud Hud server. Restart the app.");return{}}
}
// apply locally, then persist on the server (which tells the other screens)
function put(path,value,eventScoped=true){
  const e=ev();
  if(eventScoped)setL(e,path,value);else setL(DB,path,value);
  return api("/api/set",{event:eventScoped?e.id:null,path,value,by:CLIENT});
}
/* Unsaved changes. Typing in a field only changes this screen (the previews show it); nothing reaches the overlay until Save
   Changes. Buttons (scores, timers, scene switches) still act at once, because they are live controls. */
const PENDING=new Map(); // "event id|path" -> { ev, path, value, area }
const LIVE_SC=/^(?:hud\.bug\.\w+|hud\.sc\.\w+\.(bgColor|topText|bannerImg|teamText|titleText|countLabel|img|statLabels\.\d|side|pid|source|rows\.\d|imgMode|teamPic|mode|text|hh|mm|ss|ap))$/; // the tick panels' fields act at once too
const LIVE_FIELDS=new Set(["hud.scene"]); // fields that switch what is on air; picking one never waits for Save Changes
function stageEdit(path,value){
  const e=ev();if(!e)return;
  setL(e,path,value);
  PENDING.set(e.id+"|"+path,{ev:e.id,path,value,area:(META[ui.view]&&META[ui.view][0])||ui.view});
  saveBar();
}
function reapplyPending(){PENDING.forEach(d=>{const x=DB&&DB.events.find(e=>e.id===d.ev);if(x)try{setL(x,d.path,d.value)}catch{PENDING.delete(d.ev+"|"+d.path)}})}
function syncPill(){const p=$("#syncPill");if(p){p.className="pill "+(PENDING.size?"warn":"ok");p.textContent=PENDING.size?"Unsaved changes":"Synced to overlay"}}
function saveBar(){
  let b=$("#savebar");
  if(!PENDING.size){if(b)b.hidden=true;document.body.classList.remove("has-savebar");syncPill();return}
  if(!b){b=document.createElement("div");b.id="savebar";b.setAttribute("role","region");b.setAttribute("aria-label","Unsaved changes");document.body.appendChild(b)}
  const areas=[...new Set([...PENDING.values()].map(d=>{const x=DB.events.find(e=>e.id===d.ev);return (x&&x.id!==(ev()||{}).id?x.name+" · ":"")+d.area}))];
  b.hidden=false;document.body.classList.add("has-savebar");syncPill();
  const nav=$(".nav");if(nav)b.style.setProperty("--savebar-left",nav.getBoundingClientRect().right+"px");
  b.innerHTML=`<span>${areas.length} unsaved area${areas.length===1?"":"s"}: ${esc(areas.join(", "))}</span><span class="row c" style="gap:8px"><button class="btn" type="button" data-act="saveCancel">Cancel</button><button class="btn primary" type="button" data-act="saveAll">Save Changes</button></span>`;
}
async function saveAll(){
  if(!PENDING.size)return;
  const list=[...PENDING.values()];let failed=0;
  for(const d of list){const j=await api("/api/set",{event:d.ev,path:d.path,value:d.value,by:CLIENT});if(j&&j.ok===false||j&&j.error)failed++;else PENDING.delete(d.ev+"|"+d.path)}
  saveBar();toast(failed?`${failed} change${failed===1?"":"s"} could not be saved.`:"Changes saved");
}
async function cancelAll(){
  PENDING.clear();saveBar();
  try{const r=await fetch("/api/state").then(r=>r.json());if(r&&r.db)DB=r.db}catch{}
  render();toast("Changes discarded");
}
function connect(){
  const es=new EventSource("/events?kind=dashboard");
  es.addEventListener("db",m=>{const p=JSON.parse(m.data);SCREENS=p.screens||SCREENS;
    const first=!DB;DB=p.db;reapplyPending(); // keep what is being typed when another screen or a game feed changes something
    if(first){const q=new URLSearchParams(location.search).get("event");if(q&&DB.events.some(x=>x.id===q)){ui.cur=q;ui.view="overview"}render();return}
    if(p.by===CLIENT){railStatus();return}
    if(p.by==="screens"){railStatus();const s=$("#screens");if(s)s.textContent=screensText();return}
    const a=document.activeElement;
    if(a&&a.closest(".page")&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))mirrors();else render();
  });
  es.addEventListener("draft",m=>{DRAFT=JSON.parse(m.data);updateStages();const b=$("#draftBox");if(b)b.innerHTML=draftBoxHtml()});
  es.addEventListener("game",m=>{const j=JSON.parse(m.data),prev=FEEDS[j.key]&&FEEDS[j.key].source;FEEDS[j.key]=j.game;if(!DB)return;const e=ev();if(!e||SaintsHUD.feedKey(e)!==j.key)return;if(prev&&prev!==j.game.source&&ui.view==="live")render();else{updateStages();liveBits()}});
  es.addEventListener("notice",m=>toast(JSON.parse(m.data).text));
  es.onopen=()=>{online=true;railStatus()};
  es.onerror=()=>{online=false;railStatus()};
}

/* VALORANT agents for the roster dropdown: the server fetches the list from valorant-api.com once and keeps it on disk; offline it stays empty and a player's agent is simply "none" */
let VALAG=null;
function valAgentList(){
  if(VALAG===null){VALAG=[];fetch("/api/val/agents").then(r=>r.ok?r.json():[]).then(a=>{if(Array.isArray(a)&&a.length){VALAG=a;if(ui.view==="teams"&&!(document.activeElement&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)))render()}else setTimeout(()=>{VALAG=null},30000)}).catch(()=>setTimeout(()=>{VALAG=null},30000))}
  return VALAG;
}

function sourceState(){
  if(!online)return["bad","Server offline"];
  if(!G())return["warn","Waiting…"];
  if(G().source==="manual")return["ok",((ev()||{}).game||"Scored")+" · scored by hand"];
  if(G().source==="mc"){const s=G().mc;return s&&s.connected?["ok","Minecraft · server connected"]:G().connected?["ok","Minecraft · screen OCR"]:["warn","Minecraft · no server or screen reading"]}
  const src={rl:"Rocket League",lol:"League of Legends",ocr:"Screen OCR",demo:"Demo (test)",push:"External feed"}[G().source]||G().source||"No source";
  const eg=(ev()||{}).game,fg={rl:"Rocket League",lol:"League of Legends"}[G().source];
  if(fg&&eg&&fg!==eg)return["bad","Feed is "+fg+" but the event is "+eg];
  if(G().source==="ocr"){const o=G().ocr||{};return o.running?(G().connected?["ok","Screen OCR · reading"]:["warn","Screen OCR · "+(o.error?"capture problem":"starting")]):["warn","Screen OCR · not started"]}
  if(G().source==="lol")return G().inMatch?["ok","League · in game"]:G().connected?["warn","League · loading"]:["bad","League · no game or replay"];
  if(G().source==="rl")return G().connected?(G().inMatch?["ok","Rocket League · in match"]:["warn","Rocket League · no match"]):["bad","Rocket League · not found"];
  return G().connected?["ok",src]:["warn",src+" · no data"];
}

  return`<div class="halves" style="grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)"><div class="sec">

    <div class="note">Capture needs the game in <b>borderless windowed</b> mode. Exclusive fullscreen can't be captured.</div>

function gameData(e){
  const box=(t,b)=>`<div class="box"><b>${t}</b><p class="sub">${b}</p></div>`,g=e.game;
  const other=box("Other trackers",`Any program can send Stats API–shaped JSON to <code class="mono">${esc(location.origin)}/api/ingest</code>, for example <code>{"Event":"UpdateState","Data":{…}}</code>, with this event's source set to External on Live Game.`);
  if(g==="Rocket League")return box("Rocket League (official Stats API)",`On the game PC, edit <code>&lt;Install Dir&gt;/TAGame/Config/TAStatsAPI.ini</code> (or <code>DefaultStatsAPI.ini</code>), set <code>PacketSendRate=30</code> under <code>[TAGame.MatchStatsExporter_TA]</code>, then restart the game. Spectate the match so boost and the player card are sent.`)+other;
  if(g==="League of Legends")return box("League of Legends (Live Client Data API)","Nothing to configure. Run Chud Hud on the PC that is playing, spectating or watching a replay, and data flows once the match loads: kills, deaths, assists, CS, levels, respawn timers, towers, dragons and barons. Replay controls need the Replay API switched on: Live Game has a button for it.")+other;
  if(g==="Minecraft")return box("Minecraft (Java server)","Connect your server on the Minecraft page: RCON for who is online, health and the border, and the server log for kills and deaths. With no server, Screen OCR can read the alive count, kills, clock and border from the screen.")+other;
  if(g==="Riftbound")return box("Riftbound","There is no live data feed. You score the match by hand on the Riftbound page: points, games, turns, the clock and the cards in play.");
  if(g==="Dead by Daylight")return box("Dead by Daylight","The game has no live data feed, no spectator mode and no official API. Score each trial on the Trials page: kills, escapes and generators. Screen OCR can read the end-of-trial screen if you point it at the game window.");
  if(g==="Fortnite")return box("Fortnite","Epic gives casters no live match feed. Score each match on the Fortnite scoring page: placement and eliminations per team, with the placement tiers set to your event's rules.");
  if(g==="Valorant")return box("VALORANT","Riot gives spectators no live data. Score each round on the Valorant page (first to 13 by default), or let Screen OCR read the observer's screen for names, scores and the clock.")+other;
  if(g==="Valorant 2v2 Skirmish")return box("VALORANT 2v2 Skirmish","Riot gives spectators no live data. Score each round on the Skirmish page (first to 10 by default), or let Screen OCR read the observer's screen for names, scores and the clock.")+other;
  return box(esc(g)+" (screen reading)","${esc(g)} has no live data feed, so scores, the clock and team names are read from the screen with Screen OCR. Pick the game's window on the Screen OCR page and draw a box around each value.".replace("${esc(g)}",esc(g)))+other;
}

/* Preview background "Game": a live picture of the game's own window, when the desktop app can find it */
const LIVEBG={ok:false,busy:false};
async function liveBgTick(){
  if(LIVEBG.busy||document.hidden)return;
  const e=ev(),kind=e&&"none",cvs=$$("[data-stage] canvas");
  if(!e||kind!=="game"||!cvs.length){LIVEBG.ok=false;return}
  LIVEBG.busy=true;
  try{
    const r=await fetch("/api/preview/frame?game="+encodeURIComponent(e.game)+"&t="+Date.now());if(!r.ok)throw new Error("none");
    const bmp=await createImageBitmap(await r.blob());
    cvs.forEach(c=>{if(c.width!==1280||c.height!==720){c.width=1280;c.height=720}const g=c.getContext("2d"),k=Math.max(1280/bmp.width,720/bmp.height),w=bmp.width*k,h=bmp.height*k;g.drawImage(bmp,(1280-w)/2,(720-h)/2,w,h);c.dataset.bg="live"});
    LIVEBG.ok=true;
  }catch(err){if(LIVEBG.ok){LIVEBG.ok=false;updateStages(true)}}  // lost the window: back to the placeholder backdrop
  LIVEBG.busy=false;
  $$("[data-bgnote]").forEach(n=>{n.textContent=LIVEBG.ok?"Live picture from the "+e.game+" window.":"Game window not found, so a placeholder backdrop is shown. Open the game in borderless or windowed mode to see it here."});
}

/* ---------- update pop-up (installed app only) ----------
   A centred card whenever a new version is waiting: what is new, then "Update now" downloads it, backs up the data folder and
   installs (Chud Hud restarts). "Later" hides it until the next start; the pill at the bottom of the sidebar brings it back. */
let UPD=null,UPDV="",UPDHIDE=false,UPDASK=false; // UPDASK: the sidebar button asked, so say the answer
const UPD_SHOW=["available","downloading","ready","installing"];
function updPill(){return UPD&&UPD_SHOW.includes(UPD.state)&&UPDHIDE?`<button class="btn sm primary updpill" type="button" data-act="updOpen">${ico("up")}Update to ${esc(UPD.version)}</button>`:""}
function updPaint(){
  const box=$("#updlg");if(!box)return;
  const u=UPD,show=u&&(UPD_SHOW.includes(u.state)||(u.state==="error"&&u.going))&&!UPDHIDE;
  if(!show){box.innerHTML="";box.__h="";return}
  const busy=["downloading","installing"].includes(u.state)||u.going&&u.state!=="error";
  const h=`<div class="scrim upd-scrim"><div class="dialog upd-dlg" role="dialog" aria-modal="true" aria-labelledby="updT">
    <header><div class="upd-hd"><img src="/brand/chud-hud.png" alt=""><div><h2 id="updT">${u.state==="installing"?"Installing the update":"Update available"}</h2><p class="muted">Version ${esc(u.version)} is out. You're on ${esc(UPDV)}.</p></div></div></header>
    <section>${u.notes?`<div class="upd-notes">${esc(u.notes)}</div>`:""}
      ${u.state==="downloading"?`<div class="upd-bar"><i style="width:${Math.max(2,+u.percent||0)}%"></i></div><p class="note">Downloading… ${+u.percent||0}%. It installs by itself when the download finishes.</p>`:""}
      ${u.state==="installing"?`<p class="note">Backing up your events, then Chud Hud restarts on the new version.</p>`:""}
      ${u.error?`<p class="note" style="color:var(--err)">${esc(u.error)}</p>`:""}
      ${!busy?`<p class="note">Your events and settings are backed up first. The overlay in OBS goes offline for a few seconds while Chud Hud restarts.</p>`:""}</section>
    <footer>${u.state==="installing"?"":`<button class="btn ghost" type="button" data-act="updLater">Later</button>`}<button class="btn primary" type="button" data-act="updGo"${busy?" disabled":""}>${u.state==="error"?"Try again":u.state==="ready"?"Restart and update":busy?"Updating…":"Update now"}</button></footer></div></div>`;
  if(box.__h!==h){box.innerHTML=h;box.__h=h}
}
if(window.chudUpdate){
  chudUpdate.state().then(r=>{if(r){UPDV=r.version;UPD=r.update;updPaint();render()}}).catch(()=>{});
  // going: "Update now" was pressed, so a failure keeps the pop-up open with the reason; the page redraws only when the state changes (the sidebar pill)
  chudUpdate.onUpdate(u=>{const prev=UPD||{},going=!!prev.going&&!["none","idle"].includes(u.state);UPD=Object.assign({},u,{going});
    if(u.state==="available"&&u.version!==prev.version)UPDHIDE=false;
    if(UPDASK&&["none","error","available"].includes(u.state)){UPDASK=false;if(u.state==="none")toast(`You're up to date (v${UPDV})`);else if(u.state==="error")toast(u.error||"Couldn't check for updates.");else UPDHIDE=false}
    updPaint();if(u.state!==prev.state)render()});
}
document.addEventListener("click",ev0=>{const b=ev0.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
  if(a==="updLater"){UPDHIDE=true;updPaint();render()}
  else if(a==="updOpen"){UPDHIDE=false;updPaint();render()}
  else if(a==="updCheck"&&window.chudUpdate){UPDASK=true;chudUpdate.check().then(r=>{if(r&&r.ok===false){UPDASK=false;toast(r.error)}else if(r&&r.state&&r.state!=="checking"){UPDASK=false;UPDHIDE=false;updPaint()}else toast("Checking for updates…")}).catch(()=>{})}
  else if(a==="updGo"&&window.chudUpdate){UPD=Object.assign({},UPD,{going:true,error:""});updPaint();chudUpdate.go().then(r=>{if(r&&r.ok===false){UPD=Object.assign({},UPD,{going:false,error:r.error||"The update could not start."});updPaint()}}).catch(()=>{})}
});

function toast(msg){const box=$("#toasts"),t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.innerHTML=`${ico("check")}<span></span>`;t.lastChild.textContent=msg;box.appendChild(t);while(box.children.length>4)box.firstChild.remove();setTimeout(()=>{t.style.transition="opacity .2s";t.style.opacity="0";setTimeout(()=>t.remove(),220)},3200)}
/* "Are you sure?" pop-up for deleting things (BLOB's Delete Team card): resolves true only on the red button. Esc, Cancel or a
   click outside cancels; Cancel has the focus, so Enter never deletes by accident. */
function confirmBox(title,msg,ok){
  return new Promise(done=>{
    const el=document.createElement("div");el.className="cfm-scrim";
    el.innerHTML=`<div class="cfm" role="alertdialog" aria-modal="true" aria-labelledby="cfmT" aria-describedby="cfmM"><h2 id="cfmT"></h2><p id="cfmM"></p><div class="cfm-b"><button class="btn" type="button" data-c="no">Cancel</button><button class="btn cfm-ok" type="button" data-c="yes"></button></div></div>`;
    el.querySelector("h2").textContent=title;el.querySelector("p").textContent=msg;el.querySelector(".cfm-ok").textContent=ok;
    const end=v=>{document.removeEventListener("keydown",key,true);el.remove();done(v)},key=k=>{if(k.key==="Escape"){k.preventDefault();k.stopPropagation();end(false)}};
    el.addEventListener("click",c=>{if(c.target===el)return end(false);const b=c.target.closest("[data-c]");if(b)end(b.dataset.c==="yes")});
    document.addEventListener("keydown",key,true);document.body.appendChild(el);el.querySelector('[data-c="no"]').focus();
  });
}

// the frame the photo editor starts with: people are portrait, covers and screenshots wide, logos and ads keep their own shape
const cropShape=up=>/\.(avatar|portrait)$/.test(up)?"portrait":/(^|\.)(cover|bgImage|barBg)$/.test(up)?"wide":"free";
/* Ads size themselves: a picture with transparent margins is trimmed to its visible art (the overlay then scales it to fill the ad box), so no cropping step is needed. */
async function trimTransparent(file){
  if(!/^image\/(png|webp)$/.test(file.type))return file;
  try{const bmp=await createImageBitmap(file),w=bmp.width,h=bmp.height;if(w*h>36e6)return file;
    const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d",{willReadFrequently:true});x.drawImage(bmp,0,0);
    const d=x.getImageData(0,0,w,h).data;let x0=w,y0=h,x1=-1,y1=-1;
    for(let y=0;y<h;y++)for(let i=0,o=y*w*4;i<w;i++,o+=4)if(d[o+3]>8){if(i<x0)x0=i;if(i>x1)x1=i;if(y<y0)y0=y;if(y>y1)y1=y}
    if(x1<0)return file;const cw=x1-x0+1,ch=y1-y0+1;if(cw*ch>w*h*.98)return file;
    const o=document.createElement("canvas");o.width=cw;o.height=ch;o.getContext("2d").drawImage(c,x0,y0,cw,ch,0,0,cw,ch);
    const blob=await new Promise(r=>o.toBlob(r,"image/png"));return blob||file}catch(e){return file}
}
async function upload(input,file,edited){
  if(input.dataset.upload==="!ads.add"&&file){file=await trimTransparent(file);edited=true}
  if(!edited&&file&&/^image\/(png|jpeg|webp)$/.test(file.type)&&window.ChudCrop){const out=await ChudCrop.open(file,cropShape(input.dataset.upload||""));if(!out)return;file=out}
  const vid=input.dataset.video!==undefined&&file&&(/^video\/(mp4|webm|quicktime)$/.test(file.type)||/\.mov$/i.test(file.name));
  if(!file||!(file.type.startsWith("image/")||vid)){toast(input.dataset.video!==undefined?"Use a picture (PNG, JPG, WebP, GIF) or a video (MP4, WebM, MOV).":"That file isn't an image. Use PNG, JPG, SVG or WebP.");return}
  try{const r=await fetch("/api/upload",{method:"POST",headers:{"content-type":vid&&!file.type?"video/quicktime":file.type},body:file});const j=await r.json();
    if(!r.ok)return toast(j.error||"Upload failed.");
    const up=input.dataset.upload;
    if(up==="!ads.add"){const e=ev(),cur=e.ads||{items:[],mode:"off",start:0};
      await put("ads",Object.assign({},cur,{start:cur.start||Date.now(),items:(cur.items||[]).concat([{id:uid(),url:j.url,secs:/\.(mp4|webm|mov)$/i.test(j.url)?15:8,fit:"contain",on:true}])}));toast("Ad added")}
    else if(up.startsWith("!settings.icons."))await put("settings.icons",Object.assign({},DB.settings.icons||{},{[up.slice(16)]:j.url}),false);
    else await put(up,j.url);
    render()}
  catch(e){toast("Upload failed. Is the server running?")}
}

    put("val.veto",V);updateStages();render();return}
  if(el.dataset.agsstep!==undefined){const e=ev();if(!e)return;put("val.ags",Object.assign({},e.val.ags||{},{step:+el.value}));updateStages();return}
  if(el.dataset.agspid){const e=ev();if(!e)return;const a=Object.assign({st:{}},e.val.ags||{}),pid=el.dataset.agspid;a.st=Object.assign({},a.st);
    if(el.dataset.k==="st"){a.st[pid]=el.value;put("val.ags",a)}
    else{const ti=e.teams.findIndex(t=>t.players.some(p=>p.id===pid)),pi=ti<0?-1:e.teams[ti].players.findIndex(p=>p.id===pid);if(pi<0)return;const ag=(VALAG||[]).find(x=>x.uuid===el.value);
      put(`teams.${ti}.players.${pi}.agent`,el.value);put(`teams.${ti}.players.${pi}.agentName`,ag?ag.name:"")}
    updateStages();render();return}
  if(el.dataset.fnl||el.dataset.fnshow||el.dataset.fngames!==undefined){const e=ev();if(!e)return;
    if(el.dataset.fngames!==undefined){put("fn.games",Math.max(1,parseInt(el.value)||6));updateStages();return}
    const L=JSON.parse(JSON.stringify(e.fn.live||{}));
    if(el.dataset.fnshow){L.show=Object.assign({},L.show);if(el.checked)delete L.show[el.dataset.fnshow];else L.show[el.dataset.fnshow]=false}
    else{const ks=el.dataset.fnl.split("."),last=ks.pop();let o=L;for(const k of ks){if(k==="__proto__"||k==="constructor")return;o=o[k]=Object.assign({},o[k])}o[last]=el.type==="number"?(el.value===""?"":Math.max(0,parseInt(el.value)||0)):el.value}
    put("fn.live",L);updateStages();return}
  if(el.dataset.rbpick){const e=ev();if(!e)return;const[k,s]=el.dataset.rbpick.split("|"),c=rbFind(el.value),A=(e.rb[k]||["",""]).slice();if(el.value&&!c)return;A[+s]=c?{id:c.id,name:c.name}:"";put("rb."+k,A);updateStages();return}
  if(el.dataset.rbsdbf!==undefined){const e=ev();if(!e)return;const b=(e.rb.bf||[])[+el.value];put("rb.sd",Object.assign({},e.rb.sd,{bf:b&&b.id?b:""}));updateStages();return}
  if(el.dataset.valp){const e=ev();if(!e)return;const P=Object.assign({},e.val.p||{}),q=Object.assign({},P[el.dataset.valp]||{}),k=el.dataset.k; // one player's panel numbers, saved as a whole map (the server only sets existing paths)
    q[k]=k==="gun"?el.value:el.value===""?"":Math.max(0,parseInt(el.value)||0);P[el.dataset.valp]=q;put("val.p",P);updateStages();return}
  if(el.id==="ocrLayout"){if(OCR_LAYOUTS[el.value]){ocrCfg().regions=OCR_LAYOUTS[el.value].map(([key,x,y,w,h])=>({id:uid(),key,label:"",type:OCR_ROLES[key][1],polarity:"auto",x,y,w,h}));OCR.sel=null;ocrBoxes();ocrRows();ocrSave()}el.value="";return}
  if(el.dataset.rkey||el.dataset.rtype||el.dataset.rpol){const id=el.dataset.rkey||el.dataset.rtype||el.dataset.rpol,r=ocrCfg().regions.find(x=>x.id===id);if(!r)return;
    if(el.dataset.rkey){r.key=el.value;r.type=OCR_ROLES[el.value][1]}else if(el.dataset.rtype)r.type=el.value;else r.polarity=el.value;
    ocrBoxes();ocrRows();ocrSave();return}
  if(el.id==="rpTime"){lolPost("playback",{time:+el.value});return}
  if(el.dataset.rp){lolPost("render",{[el.dataset.rp]:el.type==="checkbox"?el.checked:el.value});return}
  if(/^teams\.\d+\.players\.\d+\.agent$/.test(el.dataset.bind||"")){const ag=(VALAG||[]).find(x=>x.uuid===el.value);put(el.dataset.bind+"Name",ag?ag.name:"")} // the agent's name for the Agent Select cards
  if(el.dataset.bind==="val.squad"){const e=ev();if(e)e.teams.forEach((t,i)=>{const n=Math.max(2,Math.min(5,+e.val.squad||2));if(t.players.length<n){while(t.players.length<n)t.players.push(Object.assign(blankPlayer(),{agent:""}));put(`teams.${i}.players`,t.players)}})} // a bigger squad seats the empty roster rows
  if(el.dataset.rerender!==undefined||el.dataset.bind==="hud.show.playerCam"||/(^teams\.\d+\.(color|tag|name)$)|^camera\./.test(el.dataset.bind||""))render();
});
document.addEventListener("dragover",ev0=>{const dz=ev0.target.closest(".dz");if(dz){ev0.preventDefault();dz.classList.add("over")}});
document.addEventListener("dragleave",ev0=>{const dz=ev0.target.closest(".dz");if(dz)dz.classList.remove("over")});
document.addEventListener("drop",ev0=>{const dz=ev0.target.closest(".dz");if(!dz)return;ev0.preventDefault();dz.classList.remove("over");const inp=dz.querySelector("input[type=file]");if(inp&&ev0.dataTransfer.files[0])upload(inp,ev0.dataTransfer.files[0])});

/* ---------- screen OCR ---------- */
const OCR_ROLES={score0:["Left score","number"],score1:["Right score","number"],clock:["Game clock","time"],name0:["Left team name","text"],name1:["Right team name","text"],
  alive:["Players alive","number"],total:["Players total","number"],kills:["Kills","number"],border:["World border","number"],theme:["Build theme","text"],phase:["Round phase","text"],custom:["Custom text","text"],
  fnPlace:["Fortnite: placement","number"],fnElims:["Fortnite: eliminations","number"],dbdGens:["Dead by Daylight: generators done","number"],
  dbdS1:["DBD survivor 1 result","text"],dbdS2:["DBD survivor 2 result","text"],dbdS3:["DBD survivor 3 result","text"],dbdS4:["DBD survivor 4 result","text"]};
/* Only what suits the event's game is offered: a Fortnite event never lists Dead by Daylight's survivors, VALORANT never lists the Minecraft world border. A box already set to something else keeps its own entry. */
const OCR_BASE=["score0","score1","clock","name0","name1","custom"];
const OCR_GAME_ROLES={"Valorant":[...OCR_BASE,"phase"],"Valorant 2v2 Skirmish":[...OCR_BASE,"phase"],"Minecraft":["alive","total","kills","clock","border","theme","phase","custom"],"Fortnite":["fnPlace","fnElims","clock","custom"],"Dead by Daylight":["dbdGens","dbdS1","dbdS2","dbdS3","dbdS4","clock","custom"]};
const OCR_GAME_LAYOUTS={"Minecraft":["mchg","mcbb"],"Fortnite":["fn"],"Dead by Daylight":["dbd"]};
const OCR_LAYOUT_NAME={top:"Top-centre scorebar",corners:"Scores in the top corners",fn:"Fortnite: match results screen",dbd:"Dead by Daylight: trial tally screen",mchg:"Hunger Games HUD",mcbb:"Build Battle HUD"};
const ocrRoleKeys=cur=>{const e=ev(),k=(e&&OCR_GAME_ROLES[e.game])||OCR_BASE;return cur&&!k.includes(cur)&&OCR_ROLES[cur]?[...k,cur]:k};
const ocrLayoutKeys=()=>{const e=ev();return(e&&OCR_GAME_LAYOUTS[e.game])||["top","corners"]};
// starting positions only (fractions of the frame; a 6th value turns on pixel-font reading): every game's HUD is different
const OCR_LAYOUTS={
  top:[["name0",.30,.02,.13,.05],["score0",.44,.02,.04,.05],["clock",.47,.075,.06,.045],["score1",.52,.02,.04,.05],["name1",.57,.02,.13,.05]],
  corners:[["score0",.05,.03,.06,.07],["score1",.89,.03,.06,.07],["clock",.47,.02,.06,.05]],
  mchg:[["alive",.93,.36,.05,.04,1],["kills",.93,.405,.05,.04,1],["clock",.92,.45,.06,.04,1],["border",.93,.495,.05,.04,1]],
  mcbb:[["theme",.40,.03,.20,.05,1],["clock",.46,.085,.08,.045,1],["phase",.40,.14,.20,.04,1]],
  fn:[["fnPlace",.44,.30,.12,.09],["fnElims",.44,.44,.12,.07]],
  dbd:[["dbdS1",.62,.28,.16,.05],["dbdS2",.62,.36,.16,.05],["dbdS3",.62,.44,.16,.05],["dbdS4",.62,.52,.16,.05],["dbdGens",.30,.30,.06,.06]]};
let OCR={available:true,shown:[],sel:null},ocrTimer=null,ocrSaveT=null,ocrBusy=false;
const ocrCfg=()=>DB.settings.ocr||(DB.settings.ocr={sourceId:"",sourceName:"",interval:800,regions:[]});
function ocrSave(now){clearTimeout(ocrSaveT);const go=()=>api("/api/ocr/config",ocrCfg());return now?go():(ocrSaveT=setTimeout(go,300))}
async function ocrMount(){
  const st=await fetch("/api/ocr/state").then(r=>r.json()).catch(()=>({available:false}));
  if(!st.available){if(OCR.available){OCR.available=false;render()}return}
  OCR.available=true;
  if(!$("#ocrStage"))return;
  ocrLoadSources();ocrBoxes();ocrRows();ocrFrameLoop();ocrLive();
}
function ocrLoadSources(){
  fetch("/api/ocr/sources").then(r=>r.json()).then(l=>{OCR.shown=(Array.isArray(l)?l:[]).filter(s=>!/Chud Hud/i.test(s.name));ocrSourcesRender()})
    .catch(()=>{const el=$("#ocrSources");if(el)el.innerHTML=`<span class="note">Couldn't list screens and windows.</span>`});
}
function ocrSourcesRender(){
  const el=$("#ocrSources");if(!el)return;const c=ocrCfg();
  el.innerHTML=OCR.shown.map((s,i)=>`<button type="button" class="src" data-act="ocrPick" data-arg="${i}" aria-pressed="${c.sourceId===s.id||(!!c.sourceName&&c.sourceName===s.name)}"><img src="${s.thumb}" alt=""><span>${esc(s.name)}</span></button>`).join("")||`<span class="note">No screens or windows found.</span>`;
}
function ocrFrameLoop(){
  clearInterval(ocrTimer);
  ocrTimer=setInterval(()=>{
    const img=$("#ocrFrame"),c=ocrCfg();
    if(ui.view!=="ocr"||document.hidden||!img||ocrBusy||(!c.sourceId&&!c.sourceName))return;
    ocrBusy=true;const n=new Image();
    n.onload=()=>{img.src=n.src;img.hidden=false;const em=$("#ocrEmpty");if(em)em.hidden=true;const st=$("#ocrStage");if(st)st.style.aspectRatio=`${n.naturalWidth}/${n.naturalHeight}`;ocrBusy=false};
    n.onerror=()=>{const em=$("#ocrEmpty");if(em){em.hidden=false;em.textContent="Can't capture that source. Pick it again from the list."}ocrBusy=false};
    n.src=`/api/ocr/frame?source=${encodeURIComponent(c.sourceId||"")}&t=${Date.now()}`;
  },1200);
}
function ocrBoxes(){
  const box=$("#ocrBoxes");if(!box)return;
  box.innerHTML=ocrCfg().regions.map(r=>`<div class="rg${OCR.sel===r.id?" sel":""}" data-rid="${r.id}" style="left:${r.x*100}%;top:${r.y*100}%;width:${r.w*100}%;height:${r.h*100}%"><span>${esc((OCR_ROLES[r.key]||[r.key])[0])}</span><i class="hd"></i></div>`).join("");
}
function ocrRows(){
  const tb=$("#ocrRows");if(!tb)return;
  tb.innerHTML=ocrCfg().regions.map(r=>`<tr><td><select data-rkey="${r.id}" aria-label="What this box reads">${ocrRoleKeys(r.key).map(k=>`<option value="${k}"${r.key===k?" selected":""}>${OCR_ROLES[k][0]}</option>`).join("")}</select>${r.key==="custom"?`<select data-rtype="${r.id}" aria-label="Value type">${["text","number","time"].map(t=>`<option${r.type===t?" selected":""}>${t}</option>`).join("")}</select>`:""}</td>
    <td class="read" data-rawof="${r.id}">—</td><td class="read" data-valof="${r.id}">—</td>
    <td><div class="row c nowrap"><button class="btn sm" type="button" data-act="ocrTest" data-arg="${r.id}">Test</button>
    <select data-rpol="${r.id}" aria-label="Text colour">${[["auto","Auto"],["light","Light text"],["dark","Dark text"]].map(([v,n])=>`<option value="${v}"${(r.polarity||"auto")===v?" selected":""}>${n}</option>`).join("")}</select>
    <button class="btn icon" type="button" data-act="ocrDel" data-arg="${r.id}" aria-label="Delete box">${ico("x")}</button></div></td></tr>`).join("")||`<tr><td colspan="4" class="sub" style="padding:14px">No boxes yet. Drag on the picture to draw one.</td></tr>`;
}
function ocrLive(){
  const o=G()&&G().ocr||{},pill=$("#ocrPill");
  if(pill){pill.className="pill "+(o.running&&!o.error?"ok":o.error?"bad":"");pill.textContent=o.running?(o.error?"Problem":`Reading · ${o.cycleMs||0} ms per pass`):"Stopped"}
  const er=$("#ocrError");if(er)er.textContent=o.error||"";
  $$("[data-rawof]").forEach(td=>{const r=(o.readings||{})[td.dataset.rawof];td.textContent=r?(r.error?"error":(r.raw||"(blank)")):"—"});
  $$("[data-valof]").forEach(td=>{const r=(o.readings||{})[td.dataset.valof];td.textContent=r&&r.value!=null?(r.key==="clock"?SaintsHUD.fmt(r.value):r.value):"—";td.className="read "+(r&&r.ok?"ok":"bad")});
}
setInterval(async()=>{try{const s=await(await fetch("/api/license")).json(),lk=s.enforced&&!s.licensed;let b=$("#lockbar");
  if(lk&&!b){b=document.createElement("div");b.id="lockbar";b.className="scrim";b.style.zIndex=99;b.innerHTML=`<div class="dialog" role="alertdialog"><h2>Locked</h2><p>${esc(s.message||"This copy isn't activated.")}</p><p class="faint">Close this window and open the launcher to enter a code.</p></div>`;document.body.appendChild(b)}
  else if(!lk&&b)b.remove()}catch(e){}},20000);
/* shortcuts: Ctrl+K palette, Ctrl+N new event, Esc closes, arrows and Enter in the palette */
document.addEventListener("keydown",k=>{
  const mod=k.ctrlKey||k.metaKey,key=String(k.key).toLowerCase();
  if(mod&&key==="k"){k.preventDefault();OVL&&OVL.type==="palette"?closeOverlay():openPalette();return}
  if(mod&&key==="n"&&DB){k.preventDefault();openNew();return}
  if(mod&&key==="s"){k.preventDefault();saveAll();return}
  if(!OVL)return;
  if(k.key==="Escape"){closeOverlay();return}
  if(OVL.type==="palette"){
    if(k.key==="ArrowDown"||k.key==="ArrowUp"){k.preventDefault();const n=Math.max(1,PAL.length);OVL.i=(OVL.i+(k.key==="ArrowDown"?1:-1)+n)%n;$("#palList").innerHTML=palList();const on=$("#palList .on");on&&on.scrollIntoView({block:"nearest"});return}
    if(k.key==="Enter"){k.preventDefault();const it=PAL[OVL.i];if(it){closeOverlay();it.run()}}
  }else if(OVL.type==="new"&&k.key==="Enter"&&k.target.id==="neName"){k.preventDefault();createEvent()}
});
/* click an element in the Hunger Games preview to edit it */
document.addEventListener("click",ev0=>{
  const el=ev0.target.closest("[data-stage] [data-el]"),e=ev();if(!el||!e||ui.view!=="hud"||e.game!=="Minecraft")return;
  HGEL=el.dataset.el;render();
});
document.addEventListener("pointerdown",ev0=>{
  const box=ev0.target.closest("#ocrBoxes");if(!box)return;
  const rect=box.getBoundingClientRect(),c=ocrCfg(),cl=v=>Math.max(0,Math.min(1,v)),rel=(x,y)=>[(x-rect.left)/rect.width,(y-rect.top)/rect.height];
  const rg=ev0.target.closest(".rg"),start=rel(ev0.clientX,ev0.clientY);let mode,reg,orig;
  if(rg){reg=c.regions.find(r=>r.id===rg.dataset.rid);mode=ev0.target.classList.contains("hd")?"resize":"move";OCR.sel=reg.id}
  else{const key=$("#ocrNewRole").value;reg={id:uid(),key,label:"",type:OCR_ROLES[key][1],polarity:"auto",x:cl(start[0]),y:cl(start[1]),w:0,h:0};c.regions.push(reg);OCR.sel=reg.id;mode="draw"}
  orig=Object.assign({},reg);box.setPointerCapture(ev0.pointerId);ev0.preventDefault();
  const move=m=>{const[x,y]=rel(m.clientX,m.clientY),dx=x-start[0],dy=y-start[1];
    if(mode==="move"){reg.x=cl(Math.min(orig.x+dx,1-reg.w));reg.y=cl(Math.min(orig.y+dy,1-reg.h))}
    else if(mode==="resize"){reg.w=Math.max(.01,Math.min(orig.w+dx,1-reg.x));reg.h=Math.max(.01,Math.min(orig.h+dy,1-reg.y))}
    else{reg.x=cl(Math.min(x,start[0]));reg.y=cl(Math.min(y,start[1]));reg.w=Math.abs(cl(x)-cl(start[0]));reg.h=Math.abs(cl(y)-cl(start[1]))}
    ocrBoxes()};
  const up=()=>{box.removeEventListener("pointermove",move);box.removeEventListener("pointerup",up);
    if(mode==="draw"&&(reg.w<.01||reg.h<.01)){c.regions=c.regions.filter(r=>r!==reg);OCR.sel=null}
    ocrBoxes();ocrRows();ocrSave()};
  box.addEventListener("pointermove",move);box.addEventListener("pointerup",up);
});

/* ---------- League replay controls ---------- */
let RP=null,rpBusy=false;
const lolPost=async(what,body)=>{const j=await api("/api/lol/"+what,body);rpPoll();return j};
async function rpPoll(){
  if(ui.view!=="live"||rpBusy||!$("#replayPanel"))return;
  rpBusy=true;try{RP=await fetch("/api/lol/replay").then(r=>r.json())}catch(e){RP=null}rpBusy=false;rpRender();
}
function rpRender(){
  const el=$("#replayPanel");if(!el||!RP)return;
  if(el.contains(document.activeElement)&&/range|select/.test(document.activeElement.type||""))return; // don't fight the user's hand
  if(!RP.available){const c=RP.config||{};
    el.innerHTML=`<div class="rp"><b>Replay controls</b><p class="note">${esc(RP.reason||"")}</p>${c.found?(c.enabled?`<p class="note">The Replay API is switched on in game.cfg. Close the replay and open it again for it to take effect.</p>`:`<div class="row c"><button class="btn sm blue" type="button" data-act="enableReplayApi">Turn on Replay API</button><span class="note">Adds EnableReplayApi=1 to ${esc(c.file)}. Reopen the replay afterwards.</span></div>`):`<p class="note">League's game.cfg wasn't found in C:\\Riot Games\\League of Legends. Set the LOL_DIR variable to your install folder.</p>`}</div>`;return}
  const pb=RP.playback||{},rn=RP.render||{},fm=s=>SaintsHUD.fmt(Math.floor(s||0));
  const names=(G()&&G().players||[]).map(p=>p.name);
  const modes=["fps","tps","top"].concat(rn.cameraMode&&!["fps","tps","top"].includes(rn.cameraMode)?[rn.cameraMode]:[]);
  const bools=Object.keys(rn).filter(k=>typeof rn[k]==="boolean"&&/^interface/.test(k));
  el.innerHTML=`<div class="rp"><div class="row c" style="justify-content:space-between"><b>Replay controls</b><span class="read">${fm(pb.time)} / ${fm(pb.length)}</span></div>
    <input type="range" id="rpTime" min="0" max="${Math.floor(pb.length||0)}" step="1" value="${Math.floor(pb.time||0)}" aria-label="Replay time">
    <div class="row c"><button class="btn sm blue" type="button" data-act="rpPause">${pb.paused?"Play":"Pause"}</button>${[-30,-10,10,30].map(d=>`<button class="btn sm" type="button" data-act="rpSeek" data-arg="${d}">${d>0?"+":""}${d}s</button>`).join("")}</div>
    <div class="row c"><span class="note">Speed</span>${[0.5,1,2,4,8].map(s=>`<button class="btn sm${pb.speed===s?" blue":""}" type="button" data-act="rpSpeed" data-arg="${s}">${s}×</button>`).join("")}</div>
    <div class="row">${"cameraMode" in rn?`<label class="fld" style="max-width:150px"><span>Camera</span><select data-rp="cameraMode">${modes.map(v=>`<option${rn.cameraMode===v?" selected":""}>${v}</option>`).join("")}</select></label>`:""}
    ${"selectionName" in rn&&names.length?`<label class="fld"><span>Follow player</span><select data-rp="selectionName"><option value="">None</option>${names.map(n=>`<option${rn.selectionName===n?" selected":""}>${esc(n)}</option>`).join("")}</select></label>`:""}</div>
    ${bools.length?`<div class="chks">${bools.map(k=>`<label class="chk"><input type="checkbox" data-rp="${k}"${rn[k]?" checked":""}>${esc(k.replace(/^interface/,"").replace(/([A-Z])/g," $1").trim())}</label>`).join("")}</div>`:""}</div>`;
}
setInterval(rpPoll,1500);

render();connect();
})();
