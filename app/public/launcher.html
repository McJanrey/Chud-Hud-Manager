<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saints HUD</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap">
<style>
:root{--bg:#08110d;--panel:#0d1713;--raised:#12201a;--field:#0a120f;--line:#1c2c24;--line2:#27402f;--fg:#eef3ef;--dim:#8fa399;--faint:#5e7468;
  --accent:#FDC82F;--on-accent:#14200a;--brand:#00693C;--ok:#3ecf72;--bad:#ff5d5d;
  --f-ui:"Libre Franklin","Segoe UI",system-ui,sans-serif;--f-head:"Montserrat","Libre Franklin",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-ui);display:flex;flex-direction:column;overflow:hidden;user-select:none}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}

/* title bar: drag region plus window buttons */
.tb{height:32px;flex:none;display:flex;align-items:center;justify-content:space-between;padding-left:14px;background:#0a1410;border-bottom:1px solid var(--line);-webkit-app-region:drag}
.tb .nm{font:800 13px var(--f-head);letter-spacing:.04em;color:var(--accent)}.tb .nm b{color:#fff}.tb .nm small{font:500 9px var(--f-ui);color:var(--faint);margin-left:5px;letter-spacing:0}
.tb .wc{display:flex;height:100%;-webkit-app-region:no-drag}
.tb .wc button{width:46px;border:0;background:none;color:var(--dim);cursor:pointer;display:grid;place-items:center}
.tb .wc button:hover{background:var(--raised);color:var(--fg)}.tb .wc button.x:hover{background:#c42b1c;color:#fff}
.tb svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.3}

main{flex:1;position:relative;min-height:0}
.view{position:absolute;inset:0}

/* sign in */
#login{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}
.art{position:relative;margin:20px;border-radius:6px;overflow:hidden;background:
  repeating-linear-gradient(135deg,rgba(253,200,47,.07) 0 22px,transparent 22px 44px),
  radial-gradient(circle at 50% 38%,#0b8a52 0,#00693C 38%,#043a22 100%);border:1px solid var(--line2)}
.art::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.55))}
.art img{position:absolute;left:50%;top:38%;width:62%;transform:translate(-50%,-50%);filter:drop-shadow(0 12px 22px rgba(0,0,0,.5))}
.art .cap{position:absolute;left:0;right:0;bottom:28px;text-align:center;font:800 30px var(--f-head);letter-spacing:.12em;color:var(--accent);text-shadow:0 2px 0 rgba(0,0,0,.4)}
.art .cap small{display:block;font:600 12px var(--f-ui);letter-spacing:.3em;color:#e8f3ec;margin-top:4px}
.side{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:30px 40px;text-align:center}
.side h1{margin:0;font:700 26px var(--f-head)}.side h1 b{color:var(--accent)}
.side .sub{color:var(--dim)}
.form{width:300px;display:flex;flex-direction:column;gap:10px;margin-top:6px;text-align:left}
.form label{font-size:11px;letter-spacing:.06em;color:var(--faint);font-weight:600}
.form input{width:100%;background:var(--field);border:1px solid var(--line2);border-radius:8px;padding:10px 12px;user-select:text}
.form input::placeholder{color:var(--faint)}
.err{color:var(--bad);font-size:12px;min-height:16px}
.btn{border:0;border-radius:8px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--on-accent)}
.btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.55;cursor:default}
.btn.blue{background:#2f7bff;color:#fff}
.btn.ghost{background:var(--raised);color:var(--fg);border:1px solid var(--line2)}
.fine{color:var(--faint);font-size:12px;max-width:300px}

/* main */
#home{background:radial-gradient(ellipse at 50% 0,#0e1f17,var(--bg) 70%)}
.gear{position:absolute;left:16px;top:16px;width:44px;height:44px;border-radius:10px;background:var(--raised);border:1px solid var(--line2);display:grid;place-items:center;cursor:pointer;z-index:5}
.gear:hover{border-color:var(--accent)}.gear svg{width:22px;height:22px;stroke:var(--fg);fill:none;stroke-width:1.8}
.menu{position:absolute;left:16px;top:68px;width:290px;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:14px 16px;z-index:5;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.menu .who b{display:block}.menu .who small{color:var(--dim)}
.menu hr{border:0;border-top:1px solid var(--line);margin:10px 0}
.menu .it{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:7px 0;text-align:left;cursor:pointer;color:var(--fg)}
.menu .it:hover{color:var(--accent)}.menu .it.out{color:var(--bad)}
.menu .it.link{color:#5fa0ff}
.menu input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
.top{position:absolute;right:16px;top:16px;width:200px;display:flex;flex-direction:column;gap:8px}
.top select{width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:9px 10px;font-weight:600;font-size:12px}
.card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:380px;background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:12px}
.card h2{margin:0;font:700 17px var(--f-head);display:flex;align-items:center;gap:10px}
.card h2 img{width:34px;height:34px;object-fit:contain}
.url{display:flex;gap:8px}
.url code{flex:1;min-width:0;background:var(--field);border:1px solid var(--line2);border-radius:8px;padding:9px 12px;font:12px Consolas,monospace;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;user-select:text}
.stat{color:var(--dim);font-size:13px;display:flex;align-items:center;gap:8px}
.stat .d{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.stat.ok .d{background:var(--ok)}.stat.warn .d{background:var(--accent)}.stat.bad .d{background:var(--bad)}
.stat a{color:#5fa0ff;cursor:pointer;margin-left:auto;font-size:12px}
.prog{height:6px;border-radius:3px;background:var(--field);overflow:hidden}.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.corner{position:absolute;left:16px;bottom:16px}
</style>
</head>
<body>
<div class="tb"><div class="nm">SAINTS <b>HUD</b><small id="ver"></small></div>
  <div class="wc"><button id="wmin" aria-label="Minimize"><svg viewBox="0 0 10 10"><path d="M0 5h10"/></svg></button>
  <button id="wmax" aria-label="Maximize"><svg viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9"/></svg></button>
  <button id="wx" class="x" aria-label="Close"><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0 0 10"/></svg></button></div></div>
<main>
  <section id="login" class="view hidden">
    <div class="art"><img src="/brand/saints-emblem.png" alt=""><div class="cap">ST. CLAIR SAINTS<small>BROADCAST</small></div></div>
    <div class="side">
      <h1>Sign in to <b>Saints HUD</b></h1>
      <p class="sub">Your name and email are saved on this PC for the control room.</p>
      <form class="form" id="lf" autocomplete="on">
        <label for="ln">NAME</label><input id="ln" name="name" placeholder="Your name" autocomplete="name" maxlength="60">
        <label for="le">EMAIL</label><input id="le" name="email" type="email" placeholder="you@example.com" autocomplete="email" maxlength="120">
        <div class="err" id="lerr" role="alert"></div>
        <button class="btn" id="lgo" type="submit">Sign in</button>
      </form>
      <p class="fine">There's no account server: signing in only stores a local profile. Nothing leaves this PC.</p>
    </div>
  </section>

  <section id="home" class="view hidden">
    <button class="gear" id="gear" aria-label="Settings" aria-expanded="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    <div class="menu hidden" id="menu">
      <div class="who"><b id="mname"></b><small id="mmail"></small></div><hr>
      <label class="it"><input type="checkbox" id="auto"> Open Control Room when I sign in</label>
      <button class="it link" id="mcheck">Check for updates</button>
      <button class="it" id="mdata">Open data folder</button><hr>
      <button class="it out" id="mout">Sign out</button>
    </div>
    <div class="top"><button class="btn blue" id="cr">Open Control Room</button>
      <select id="src" aria-label="Data source"></select></div>
    <div class="card">
      <h2><img src="/brand/saints-emblem.png" alt="">Saints HUD</h2>
      <div class="stat" id="srv"><i class="d"></i><span>Overlay server</span></div>
      <div class="url"><code id="ourl"></code><button class="btn ghost" id="copy">Copy</button></div>
      <div class="prog hidden" id="prog"><i></i></div>
      <div class="stat" id="us"><i class="d"></i><span id="ut"></span><a id="ua" class="hidden"></a></div>
      <button class="btn blue hidden" id="ur">Update &amp; Restart Saints HUD</button>
    </div>
    <button class="btn ghost corner" id="cu">Copy overlay URL for OBS</button>
  </section>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const api = window.saints;
  const SRC = [["auto", "Follow active game"], ["rl", "Rocket League"], ["lol", "League of Legends"], ["ocr", "Screen OCR"], ["push", "External feed"], ["demo", "Demo feed"]];
  let S = null;
  const show = v => { $("login").classList.toggle("hidden", v !== "login"); $("home").classList.toggle("hidden", v !== "home"); };
  $("wmin").onclick = () => api.win.min(); $("wmax").onclick = () => api.win.max(); $("wx").onclick = () => api.win.close();

  function renderUpdate(u) {
    const t = $("ut"), a = $("ua"), st = $("us"), pr = $("prog"), ur = $("ur"), v = S ? S.version : "";
    st.className = "stat"; a.classList.add("hidden"); pr.classList.add("hidden"); ur.classList.add("hidden");
    const link = (txt) => { a.textContent = txt; a.classList.remove("hidden"); a.onclick = () => api.checkUpdates(); };
    switch (u.state) {
      case "checking": t.textContent = "Checking for updates…"; st.classList.add("warn"); break;
      case "none": t.textContent = `You're up to date (v${v})`; st.classList.add("ok"); link("Check again"); break;
      case "available": t.textContent = `Update available (v${u.version})`; st.classList.add("warn"); ur.textContent = "Download update"; ur.classList.remove("hidden"); break;
      case "installing": t.textContent = "Backing up and installing… Saints HUD will restart."; st.classList.add("warn"); break;
      case "downloading": t.textContent = `Downloading ${u.version ? "v" + u.version : "update"}… ${u.percent || 0}%`; st.classList.add("warn");
        pr.classList.remove("hidden"); pr.firstElementChild.style.width = (u.percent || 0) + "%"; break;
      case "ready": t.textContent = `Update downloaded${u.version ? " (v" + u.version + ")" : ""}. Your data is backed up before it installs.`; st.classList.add("ok"); ur.textContent = "Update & Restart Saints HUD"; ur.classList.remove("hidden");
        if (u.error) { t.textContent = u.error; st.className = "stat bad"; } break;
      case "error": t.textContent = "Couldn't check for updates" + (u.error ? `: ${u.error}` : ""); st.classList.add("bad"); link("Try again"); break;
      case "source": t.textContent = `Running from source (v${v}). Updates apply to the installed app.`; break;
      default: t.textContent = `Version ${v}`; link("Check for updates");
    }
  }
  async function renderHome() {
    $("mname").textContent = S.profile.name; $("mmail").textContent = S.profile.email; $("auto").checked = !!S.prefs.autoOpen;
    $("ourl").textContent = location.origin + "/overlay?scene=auto"; renderUpdate(S.update);
    try { const d = await (await fetch("/api/state")).json(); $("src").value = d.db.settings.source || "auto";
      $("srv").className = "stat ok"; $("srv").lastElementChild.textContent = "Overlay server running"; }
    catch { $("srv").className = "stat bad"; $("srv").lastElementChild.textContent = "Overlay server not responding"; }
  }
  async function boot() {
    S = await api.state(); $("ver").textContent = "v" + S.version;
    $("src").innerHTML = SRC.map(([k, n]) => `<option value="${k}">${n}</option>`).join("");
    if (S.profile) { show("home"); renderHome(); } else { show("login"); $("ln").focus(); }
  }
  api.onUpdate(u => { if (S) { S.update = u; renderUpdate(u); } });

  $("lf").onsubmit = async e => {
    e.preventDefault(); $("lgo").disabled = true; $("lerr").textContent = "";
    const r = await api.signIn({ name: $("ln").value, email: $("le").value });
    $("lgo").disabled = false;
    if (!r || !r.ok) { $("lerr").textContent = (r && r.error) || "Couldn't sign in."; return; }
    S.profile = r.profile; show("home"); renderHome();
  };
  $("gear").onclick = () => { const m = $("menu"), open = m.classList.toggle("hidden") === false; $("gear").setAttribute("aria-expanded", open); };
  document.addEventListener("click", e => { if (!e.target.closest("#menu,#gear")) { $("menu").classList.add("hidden"); $("gear").setAttribute("aria-expanded", "false"); } });
  $("auto").onchange = async e => { S.prefs = await api.setPref("autoOpen", e.target.checked); };
  $("mcheck").onclick = () => api.checkUpdates(); $("mdata").onclick = () => api.openData();
  $("mout").onclick = async () => { await api.signOut(); S.profile = null; $("menu").classList.add("hidden"); $("ln").value = $("le").value = ""; show("login"); };
  $("cr").onclick = () => api.openControlRoom();
  $("ur").onclick = async () => {
    const r = await (S && S.update.state === "available" ? api.downloadUpdate() : api.installUpdate());
    if (r && r.ok === false && r.error) { $("ut").textContent = r.error; $("us").className = "stat bad"; }
  };
  $("src").onchange = e => fetch("/api/source", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ source: e.target.value }) });
  const copy = async b => { await api.copyOverlay(); const o = b.textContent; b.textContent = "Copied"; setTimeout(() => (b.textContent = o), 1200); };
  $("copy").onclick = e => copy(e.target); $("cu").onclick = e => copy(e.target);
  boot();
})();
</script>
</body>
</html>
