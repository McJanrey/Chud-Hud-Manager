# Builds the Windows installer and publishes it as a GitHub Release when a version tag (v0.3.0, v0.4.0, ...) is pushed.
# The installed app updates itself from these releases, so the tag must match the version in app/package.json.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}   # Run workflow button: publishes v<version from app/package.json> (the release creates its own tag)
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the whole history, so the release notes can list what changed since the last tag
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} doesn't match package.json version"; exit 1; }
      - run: npm ci
      - name: Tests
        run: |
          node test/league-test.js
          node test/icons-test.js
          node test/minecraft-selftest.js
          node test/security-test.js
          node test/minecraft-rcon-test.js
          node test/scenes-test.js
          node test/twitch-test.js
          node test/variant-test.js
          node test/games-test.js
          node test/license-test.js
          node test/control-test.js
          node test/draft-test.js
          node test/packaging-test.js
          node test/ads-test.js
          node test/notes-test.js
          node test/lotd-test.js
      # Release builds only run with a code from the owner, but only once the license service is set up (app/license-config.json exists),
      # so a release made before that can never lock anyone out. The flag is written into this build only, not committed.
      - name: Turn licensing on
        shell: bash
        run: |
          if [ -f license-config.json ]; then
            node -e "const f='package.json',p=JSON.parse(require('fs').readFileSync(f,'utf8'));p.enforceLicense=true;require('fs').writeFileSync(f,JSON.stringify(p,null,2))"
            echo "Licensing is ON for this release"
          else
            echo "No license-config.json yet: this release is not license-locked"
          fi
      - name: Build and publish
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Chud Hud LOTD (Lan of the Dead, the Halloween edition) goes onto the same release, with its own update file
      - name: Build and publish Chud Hud LOTD
        run: npx electron-builder --config electron-builder.lotd.js --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Chud Hud WWL (Winter Wonder-LAN, the winter edition) likewise, with its own update file
      - name: Build and publish Chud Hud WWL
        run: npx electron-builder --config electron-builder.wwl.js --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Every build above uploads into a hidden draft release. Only when all three installers and their update files are there does the
      # release go public, with its what's new text (one line per change since the previous release, shown in the app's update pop-up).
      # So an installed copy never sees a half-finished release (a missing lotd.yml or wwl.yml) while the later builds are still running.
      - name: Publish the release
        shell: bash
        run: |
          git fetch --tags --force
          V=$(node -p "require('./package.json').version")
          node tools/release-notes.js "$V" > release-notes.md
          cat release-notes.md
          REPO="${{ github.repository }}"
          ID=$(gh api "repos/$REPO/releases?per_page=30" --jq "[.[] | select(.tag_name == \"v$V\")][0].id")
          test -n "$ID" && test "$ID" != "null" || { echo "No release v$V found to publish"; exit 1; }
          NAMES=$(gh api "repos/$REPO/releases/$ID/assets" --jq ".[].name")
          for f in latest.yml lotd.yml wwl.yml; do
            echo "$NAMES" | grep -qx "$f" || { echo "$f is missing from the release, not publishing it"; exit 1; }
          done
          gh api -X PATCH "repos/$REPO/releases/$ID" -F draft=false -f make_latest=true -f body="$(cat release-notes.md)" --jq '.html_url'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
